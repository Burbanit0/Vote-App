<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e7068" />
    <meta name="description" content="Vote Lab — Testez comment votre bulletin de vote change tout. 15 méthodes de vote, données électorales réelles, vote blanc intégré." />

    <!-- Type identity: Space Grotesk (display) · Inter (body) · IBM Plex Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />

    <!-- Open Graph — defaults overridden dynamically -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Vote Lab" />
    <meta property="og:title"       content="Vote Lab — Testez comment votre bulletin change tout" />
    <meta property="og:description" content="15 méthodes de vote, données électorales réelles, vote blanc intégré." />
    <meta property="og:url"         content="https://votelab.app" />

    <!-- Twitter / X card -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Vote Lab — Testez comment votre bulletin change tout" />
    <meta name="twitter:description" content="15 méthodes de vote, données électorales réelles, vote blanc intégré." />

    <link rel="apple-touch-icon" href="/icons/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Vote Lab</title>
  </head>
  <body style="touch-action: pan-y;">
    <noscript>JavaScript est requis pour utiliser Vote Lab.</noscript>
    <div id="root"></div>
    <!-- Vite entry point -->
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
