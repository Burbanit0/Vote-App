    statement: seroval via the query devtools only; not in the production bundle (see above).
  - id: CVE-2026-104845 # = GHSA-jp82-f5mq-hwhp (high), seroval <= 1.6.2, fixed in 1.6.3
    paths:
      - "voter-app/package-lock.json"
    expired_at: 2026-11-05
    statement: seroval via the query devtools only; not in the production bundle (see above).
  - id: GHSA-jp82-f5mq-hwhp # = CVE-2026-104845 (high), seroval <= 1.6.2, fixed in 1.6.3
    paths:
      - "voter-app/package-lock.json"
