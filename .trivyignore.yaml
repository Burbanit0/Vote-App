# Trivy ignore file — triaged misconfigurations (path-scoped, NOT global).
misconfigurations:
  - id: AVD-DS-0002 # "Image user should not be 'root'"
    paths:
      - "ci-local/audit.Dockerfile"
      - "ci-local/backend.Dockerfile"
      - "ci-local/e2e.Dockerfile"
      - "ci-local/frontend.Dockerfile"
    statement: >-
      Local-only CI/scanner images — built and run as throwaway containers, never
      deployed. Running as root in a build/test container is standard (pip/npm/pytest
      write freely; the scanner image reads the COPYed .git). The PRODUCTION image
      (the repo-root Dockerfile) IS non-root, and this scope keeps DS-0002 gating
      for any future production Dockerfile.
  - id: AVD-DS-0026 # "Add HEALTHCHECK instruction"
    paths:
      - "ci-local/audit.Dockerfile"
      - "ci-local/backend.Dockerfile"
      - "ci-local/e2e.Dockerfile"
      - "ci-local/frontend.Dockerfile"
    statement: >-
      Local-only CI/scanner images — throwaway build/test containers, never
      deployed or orchestrated, so a container-level HEALTHCHECK is meaningless.
      The PRODUCTION image (the repo-root Dockerfile) DOES declare HEALTHCHECK, and
      this scope keeps DS-0026 gating for any future production Dockerfile.

vulnerabilities:
  # The two seroval advisories .github/npm-audit-allowlist.json already allows
  # (reviewed in #803), under the CVE ids Trivy's database gave them on
  # 2026-10-06, plus their GHSA ids in case a Trivy version reports those.
  # Same end date as the allowlist entries; remove all of them together once
  # solid-js 1.x accepts seroval >= 1.6.3.
  #
  # Scope: these match the advisory anywhere in voter-app/package-lock.json,
  # which is wider than the npm gate's (it re-fails if seroval appears at a new
  # node_modules path). That gate still runs on every PR and catches a new path.
  #
  # Path today: @tanstack/react-query-devtools (listed under `dependencies`, so
  # not dev-flagged in the lockfile) -> @tanstack/query-devtools -> solid-js
  # 1.9.15 (latest stable, pins seroval ~1.5.4) -> seroval 1.5.6. The devtools
  # render only when NODE_ENV !== 'production' (src/index.tsx), and a production
  # build contains no seroval (checked 2026-10-06).
  - id: CVE-2026-104846 # = GHSA-p6vx-979v-rg4c (critical), seroval <= 1.6.2, fixed in 1.6.3
    paths:
      - "voter-app/package-lock.json"
    expired_at: 2026-11-05
    statement: seroval via the query devtools only; not in the production bundle (see above).
  - id: GHSA-p6vx-979v-rg4c # = CVE-2026-104846 (critical), seroval <= 1.6.2, fixed in 1.6.3
    paths:
