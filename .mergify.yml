# Mergify (Lot 1, PLAN_SOLIDITE_TECHNIQUE.md) — third-party merge queue.
#
# GitHub's own native merge queue (a ruleset `merge_queue` rule) is not
# available on this repo: it's restricted to public repos owned by an
# *organization*, not a personal account (confirmed live via a 422 attempting
# to create that ruleset). Mergify is the pivot: free for open source,
# installed as a GitHub App (github.com/apps/mergify), zero extra config
# needed for the basics.
#
# `queue_rules` deliberately carry no explicit `check-success=...` conditions
# for CI (the one exception is the `human-review` attestation in
# merge_protections below, which is not a CI check and must stay): Mergify
# auto-detects this repo's branch
# protection (`required_status_checks`, the per-branch list that
# scripts/setup-branch-protection.sh applies: `--print-contexts <branch>`
# prints it) and injects it as merge
# conditions for both queuing and merging — duplicating that list here would
# just be a second place for it to drift out of sync.
queue_rules:
  - name: default
    # Matches the `--merge`/--no-ff convention used for every PR merged this
    # session (see CLAUDE.md's workflow section) — a real merge commit, not a
    # squash or rebase.
    merge_method: merge
    # Explicit, not `auto` (the default): `auto` derives the timeout from
    # this queue's own recent CI runtime, which broke live on 2026-09-12 —
    # a run of small, mostly-skipped-check doc/config PRs pulled the derived
    # timeout down to ~1 minute, so the next PR needing a real Playwright
    # E2E run (~10-13 min observed) got dequeued as "checks timed out" while
    # every one of its checks was still green and simply still running.
    # The slowest required chain: since 2026-10-06 the required "Playwright
    # E2E" waits for the changes job (5 min timeout), two e2e shards (20 min,
    # in parallel), then their report merge (10 min): 35 minutes of timeouts
    # before any runner queueing, so the limit leaves 10 minutes for that.
    # (mutation-testing.yml's stryker job is the only one over this, and it
    # doesn't gate the merge queue).
    checks_timeout: "45 minutes"
    # batch_size: 1 (PLAN_REMEDIATION_CI_CD.md §2.2) — GitHub's "require
    # branches to be up to date before merging" branch protection setting
    # (re-enabled 2026-09-13) is incompatible with batching: Mergify tests a
    # speculative combined branch ahead of the real one, so the real PR is
    # never "up to date" by GitHub's own definition when its turn comes,
    # and the merge is refused. Confirmed live: every PR queued after
    # re-enabling `strict` got "Configuration not compatible with a branch
    # protection setting" instead of merging. batch_size: 1 disables
    # batching entirely — queued PRs process one at a time, in place,
    # slower when several are queued at once but compatible with `strict`.
    batch_size: 1

# max_parallel_checks: 1 (same incompatibility as batch_size above, see that
# comment) — disables Mergify's speculative parallel-checks feature, which
# has the identical "not actually up to date yet" problem with `strict`.
merge_queue:
  max_parallel_checks: 1

merge_protections_settings:
  # Every PR whose (injected) required checks pass is queued and merged
  # automatically — matches the `gh pr merge` once-green pattern used
  # throughout this session, just done by Mergify instead of by hand.
  auto_merge_conditions: true

# High-risk changes wait for a human (CI hardening plan, phase 3). Auto-merge
# stays for everything else; a PR touching any path below is held until the
# maintainer has reviewed its CURRENT head commit. Families:
#  - the voting engine (both sides of the parity lock, plus the method registry
#    and metrics every API worker goes through);
#  - the safety net itself: workflows, merge rules, Claude Code hooks/settings,
#    gate scripts, the configs that set thresholds, and the allowlists/ignore
#    files of the required security scanners;
#  - test oracles that are regenerated rather than hand-written (parity
#    fixture, polity golden manifest, syrupy and visual snapshots, the API
#    contract), the test harnesses CLAUDE.md names as high-blast-radius, and
#    the baselines/snoozes/allowlists that grandfather findings. Regenerating
#    an oracle after a code change makes its drift check pass by design, so a
#    reviewed regeneration is the only thing that tells a deliberate behaviour
#    change from a bug signed off by its own oracle.
#
# The approval is bound to a commit: the owner comments `/reviewed <sha>` naming
# the head they reviewed, and human-review.yml posts a `human-review` success
# status on exactly that SHA. Any later commit, by anyone, by any route, has no
# such status and is held again. Only Mergify's own base-branch update of an
# approved head carries the approval over (see that workflow).
#
# Known limit: a status or check name is not unforgeable on GitHub. A PR that
# adds a workflow job named `human-review`, or posts such a status with its
# own token, satisfies this condition. Such a PR necessarily edits
# .github/workflows/ (held here), so this stops accidental and lazy merges of
# high-risk changes, not a deliberate forgery; only an attestation from a
# dedicated GitHub App, pinned in branch protection, would.
#
# The path list is data: scripts/check_mergify_protected_paths.py (run by
# branch-policy.yml on every PR) fails when a pattern stops matching any
# tracked file, so a config rename can't silently drop a file out of the hold.
#
# Enforcement: Mergify never evaluated this block (#731 went through the queue
# unreviewed, its required conditions listing only branch protection). The hold
# is enforced by the `High-risk review gate` status, which human-review.yml
# posts from this same path list (check_mergify_protected_paths.py --classify)
# and branch protection requires on polity and develop. This block stays as
# the list's single source and a second, Mergify-side layer if it ever applies.
merge_protections:
  - name: High-risk change needs human review
    description: >-
      Engine, CI/guardrail, gate-config, scanner-allowlist or test-oracle files
      changed. Review the PR, then comment `/reviewed <head sha>`: it approves
      that commit only.
    if:
      # polity-ui is left out until it carries human-review.yml (a hold there
      # could never be released).
      - base ~= ^(polity|develop)$
      - or:
          # Voting engine, both sides, and what every worker dispatches through.
          - files = fast_api_voter/api/engine/utils/simulation_ranked_utils.py
          - files = fast_api_voter/api/engine/utils/simulation_score_utils.py
          - files = fast_api_voter/api/engine/utils/simulation_voting_utils.py
          - files = fast_api_voter/api/engine/utils/simulation_multiwinner_utils.py
          - files = fast_api_voter/api/engine/utils/method_registry.py
          - files = fast_api_voter/api/engine/utils/simulation_metrics.py
          - files = voter-app/src/lib/playgroundVoting.ts
          - files = fast_api_voter/scripts/gen_engine_parity.py
          - files = fast_api_voter/scripts/gen_polity_golden.py
          - files = fast_api_voter/scripts/gen_openapi.py
          # The safety net.
          - files ~= ^\.github/workflows/
          - files = .mergify.yml
          - files ~= ^\.claude/
          - files ~= ^scripts/check_
          - files = scripts/setup-branch-protection.sh
          # Gate scripts outside scripts/check_*: what the push hook runs, the
          # gate's own oracle report, the doc-count and diff-mutation checks.
          - files = scripts/fast-gate.sh
          - files = scripts/oracle_diff_report.py
          - files = scripts/ci_facts.py
          - files = scripts/mutation_diff.py
          - files = fast_api_voter/scripts/check_license_compliance.sh
          - files = voter-app/vitest.stryker.config.ts
          - files = voter-app/vitest.stryker.diff.config.ts
          - files = voter-app/stryker.diff.config.json
          - files = .pre-commit-config.yaml
          # The agent's own rules.
          - files = CLAUDE.md
          - files ~= ^voter-app/scripts/check-
          - files = fast_api_voter/pyproject.toml
          - files = fast_api_voter/mypy.ini
          - files = fast_api_voter/.vulture_whitelist.py
          - files = fast_api_voter/api/core/config.py
          - files = fast_api_voter/api/core/ratelimit.py
          - files = voter-app/vitest.config.ts
          - files = voter-app/stryker.config.json
          - files = voter-app/eslint.config.js
          - files = voter-app/.dependency-cruiser.json
          - files = voter-app/.size-limit.json
          - files ~= ^voter-app/tsconfig[^/]*\.json$
          - files = voter-app/knip.json
          - files = voter-app/playwright.config.ts
          - files = voter-app/playwright.visual.config.ts
          - files = .jscpd.json
          # package.json defines the commands the gates run (lint, build,
          # test:coverage, type-coverage and its atLeast threshold). Dependabot
          # only ever bumps versions there, so its PRs stay on auto-merge.
          - and:
              - files = voter-app/package.json
              - -author = dependabot[bot]
          # The backend's pinned dependencies and their lockfiles. Unlike
          # package.json, Dependabot's bumps are held too: the owner reviews
          # every change to what the backend installs.
          - files ~= ^fast_api_voter/requirements[^/]*\.txt$
          # Required security scanners' allowlists and ignore files.
          - files = .gitleaks.toml
          - files = .gitleaksignore
          - files = .trivyignore.yaml
          - files = .semgrepignore
          - files ~= ^\.semgrep/
          - files = .secrets.baseline
          # Oracles, harnesses, baselines and exceptions.
          - files = voter-app/src/lib/__fixtures__/engineParity.json
          - files = voter-app/src/lib/playgroundVoting.parity.test.ts
          - files = voter-app/src/lib/playgroundVoting.axioms.test.ts
          - files ~= ^fast_api_voter/api/tests/golden/
          - files = fast_api_voter/api/tests/polity_golden.py
          - files = fast_api_voter/api/tests/test_polity_golden.py
          - files ~= ^fast_api_voter/api/tests/test_hypothesis_
          - files = fast_api_voter/api/tests/test_voting_criteria_matrix.py
          # The criteria registry both engines' axiom tests are checked against.
          - files = voter-app/src/data/method_criteria.json
          - files = voter-app/src/data/methodCriteria.ts
          - files = voter-app/src/data/methodCriteria.test.ts
          - files = fast_api_voter/api/tests/test_method_criteria_registry.py
          # The behaviour catalogue and its check: removing an invariant (row and
          # marker together) passes every test, so a person reads it.
          - files ~= ^docs/spec/
          - files = fast_api_voter/api/tests/test_behavior_catalogue.py
          # The journal checker and its property tests: weakening a check inside
          # it removes no test, so the test-integrity hold would not see it.
          - files = fast_api_voter/api/domain/polity/journal_invariants.py
          - files = fast_api_voter/api/tests/test_polity_journal_invariants.py
          - files = fast_api_voter/api/tests/test_engine_benchmarks.py
          - files ~= (^|/)__snapshots__/
          - files ~= -snapshots/
          - files = fast_api_voter/openapi.gen.json
          - files = voter-app/src/api/types.gen.ts
          - files = .github/ci-health-snoozes.json
          - files = .github/mutation-baseline.json
          - files = .github/quality-baseline.json
          # Any future .github baseline/snooze/allowlist (npm-audit-allowlist.json
          # arrives with #721) is covered by name.
          - files ~= ^\.github/[^/]*(baseline|snoozes|allowlist)[^/]*\.json$
    success_conditions:
      - check-success = human-review
