# Gitleaks configuration for Vote-App.
#
# Extends the full default ruleset, then allowlists the handful of files that are
# TRIAGED FALSE POSITIVES across the WHOLE git history (re-verified 2026-06-23 on
# a full `gitleaks git` scan before the repo went public):
#   • generated OpenAPI artifacts (types.gen.ts, openapi.gen.json) embed EXAMPLE
#     bearer JWTs from the OpenAPI/fastapi-users schema — not credentials, they
#     grant no access and are regenerated by `npm run gen:api`;
#   • the bibliography data file holds bibtex citation keys (e.g. equal_vote2014,
#     posner_weyl2018) that look like generic API keys but are academic refs.
#
# A PATH allowlist (rather than per-commit fingerprints in .gitleaksignore) keeps
# the whole-history scan clean as new commits touch these generated/data files.
# These three files never contain hand-authored secrets.

title = "Vote-App"

[extend]
useDefault = true

[allowlist]
description = "Triaged false positives — generated OpenAPI files + bibliography data"
paths = [
  '''voter-app/src/api/types\.gen\.ts''',
  '''fast_api_voter/openapi\.gen\.json''',
  '''voter-app/src/data/methodReferences\.ts''',
]
