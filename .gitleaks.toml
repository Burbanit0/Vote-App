# Gitleaks configuration for Vote-App.
#
# Extends the full default ruleset, then allowlists the handful of files that are
# TRIAGED FALSE POSITIVES across the WHOLE git history (re-verified 2026-06-23 on
# a full `gitleaks git` scan before the repo went public):
#   • generated OpenAPI artifacts (types.gen.ts, openapi.gen.json) embed EXAMPLE
#     bearer JWTs from the OpenAPI/fastapi-users schema — not credentials, they
#     grant no access and are regenerated by `npm run gen:api`;
#   • the bibliography data file holds bibtex citation keys (e.g. equal_vote2014,
#     posner_weyl2018) that look like generic API keys but are academic refs.
#
# A PATH allowlist (rather than per-commit fingerprints in .gitleaksignore) keeps
# the whole-history scan clean as new commits touch these generated/data files.
# These three files never contain hand-authored secrets.

title = "Vote-App"

[extend]
useDefault = true

[allowlist]
description = "Triaged false positives — generated OpenAPI files, bibliography data, token-count constants"
paths = [
  '''voter-app/src/api/types\.gen\.ts''',
  '''fast_api_voter/openapi\.gen\.json''',
  '''voter-app/src/data/methodReferences\.ts''',
]
# generic-api-key on the *_THINK_TOKEN_ALLOWANCE constants of llm_behavior_engine.py
# (first in 7fb05c28, 2026-09-13): the names contain "TOKEN" and the value is a model
# profile's attribute, a token COUNT (e.g. 12000), not a credential. Push and PR scans
# only read new commits, so this surfaced as the weekly full-history Secret Scan failing
# from 2026-09-14 on. Matched against the finding's own text, and only when the
# right-hand side is an attribute reference: a quoted literal assigned to such a name,
# or a secret elsewhere on the same line, is still reported (a "line" target would hide
# the latter). gitleaks 8.24.3 ignores regexTarget in an [[allowlists]] array, so it
# lives here, and audit.yml pins GITLEAKS_VERSION to the version this was checked on.
regexTarget = "match"
regexes = [
  '''_THINK_TOKEN_ALLOWANCE = [A-Z0-9_]+\.[a-z_]+_think_allowance\b''',
]
