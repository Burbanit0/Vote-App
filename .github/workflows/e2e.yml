name: E2E Tests

on:
  workflow_dispatch:
  # Called from release.yml as the release gate.
  workflow_call:
  # …and on every PR touching either side of the app. It used to be release-only
  # ("exhaustive and slow"), which let the specs rot against a UI that had moved
  # on for two months without anyone noticing. It belongs where the drift
  # happens: ~10 min of tests, split across two shards (see the e2e job).
  #
  # No `paths:` filter here (moved to the `changes` job below, on purpose): this
  # workflow is a required status check, and a required check scoped by `paths:`
  # at trigger level never even creates a check run on a PR that doesn't touch
  # those paths — which blocks that PR's merge FOREVER (a required check that
  # never reports can't be satisfied). That's exactly what happened to PR #205
  # (a docs/CI-only change) before this workflow was added to required checks.
  # The workflow now always triggers; the real job is skipped instead, which
  # GitHub treats as a passing required check.
  pull_request:
    branches: [develop, main, polity, polity-ui]
  push:
    branches: [develop, polity, polity-ui]

# No job writes anything back to the repo: read-only token for all of them.
permissions:
  contents: read

# A newer push to the same branch cancels the previous e2e run.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect e2e-relevant changes
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant == 'true' || steps.backend.outputs.runtime == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - 'voter-app/**'
              - '.github/workflows/e2e.yml'
      # The backend counts only where the running app can change: a change confined to
      # backend scripts, backend tests or Markdown cannot alter what the e2e suite drives.
      # `every` makes a file match only when it passes all four patterns -- inside
      # fast_api_voter/ and outside each exclusion. On `polity` most PRs touch only
      # scripts, results docs or tests, and the e2e run (~10 min of tests, in two
      # shards since 2026-10-06) stays for the rest.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: backend
        with:
          predicate-quantifier: 'every'
          filters: |
            runtime:
              - 'fast_api_voter/**'
              - '!fast_api_voter/scripts/**'
              - '!fast_api_voter/api/tests/**'
              - '!fast_api_voter/**/*.md'

  playwright-image-sync:
    needs: changes
    # Same always-runs-but-skips-fast pattern as the two jobs below: a required
    # check that never reports blocks the PR forever (see the top-of-file
    # comment on `pull_request` triggers, PR #205's real incident).
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'workflow_call' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.relevant == 'true')
    name: Playwright/Docker image version sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      # Dependabot's `docker` ecosystem only parses `Dockerfile`s — it has no
      # visibility into a `container: image:` field inline in a workflow, so a
      # routine `@playwright/test` bump (a patch/minor Dependabot groups and
      # merges on its own) can silently desync the two without Dependabot ever
      # knowing there was anything to keep in sync. This already happened for
      # real: PR #469 bumped @playwright/test 1.62.1 -> 1.63.0 and broke
      # `visual-regression` on `develop` (`Executable doesn't exist at
      # /ms-playwright/chromium_headless_shell-1243/...`), only caught and
      # fixed afterwards in hotfix PR #478. This job turns that same class of
      # break into a fast, explicit failure on the PR that introduces it,
      # instead of a cryptic missing-browser error discovered later.
      - name: Assert @playwright/test matches the visual-regression image tag
        run: |
          # `|| true` on each grep: GH Actions runs `run:` under `bash -e`,
          # so a non-matching grep (exit 1) would otherwise abort the script
          # right here -- before the explicit empty-value
          # diagnostic below ever gets a chance to run.
          pkg_version=$(grep -oP '"@playwright/test":\s*"\^?\K[0-9.]+' voter-app/package.json || true)
          image_version=$(grep -oP 'mcr\.microsoft\.com/playwright:v\K[0-9.]+' .github/workflows/e2e.yml || true)
          if [ -z "$pkg_version" ] || [ -z "$image_version" ]; then
            echo "::error::Could not extract one of the two versions to compare (package_version='$pkg_version' image_version='$image_version') -- this check itself needs fixing, not just the versions it compares."
            exit 1
          fi
          if [ "$pkg_version" != "$image_version" ]; then
            echo "::error::Playwright version mismatch: voter-app/package.json pins @playwright/test@$pkg_version, but this workflow's visual-regression job pins mcr.microsoft.com/playwright:v$image_version-noble. These must match exactly -- pixel comparisons need a byte-identical browser build (see docs/exploration/EXP-004). Update the 'image:' line in this file's visual-regression job to v$pkg_version-noble."
            exit 1
          fi
          echo "OK: @playwright/test and the visual-regression Docker image both pinned to $pkg_version"

  # Two shards, then one `Playwright E2E` job that merges their reports. The
  # suite took ~10 of the job's 11 minutes; split in two (198 + 197 tests) it
  # runs in parallel. The required check is the aggregator below, which keeps
  # the exact name branch protection, Mergify and ci-local know.
  e2e:
    needs: changes
    # Always run for a manual dispatch or the release-gate call (no paths to
    # filter on); otherwise only when the changes job found something relevant.
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'workflow_call' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.relevant == 'true')
    name: Playwright E2E (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Both shards always finish: a failure in one says nothing about the other.
      fail-fast: false
      matrix:
        # To add a shard: extend `shard` and `total`, and EXPECTED_SHARDS in
        # e2e-report below.
        shard: [1, 2]
        total: [2]

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      # ── Python / Flask backend ────────────────────────────────────────────────
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # No `python-version` here — see backend-ci-cd-pipeline.yml's comment on
      # this same pairing (`--system` rejects a uv-managed interpreter).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: 'fast_api_voter/requirements*.txt'

      - name: Install Python dependencies
        run: uv pip install --system -r fast_api_voter/requirements.lock.txt

      # The backend is a fixture here (Assemblée mode and two Laboratoire fiches
      # call /api/v2/*); it is stateless — no DB, no JWT since auth was removed.
      - name: Start FastAPI backend (testing mode)
        run: |
          cd fast_api_voter
          FLASK_ENV=testing \
          uvicorn api.main:app --host 0.0.0.0 --port 4434 &
          # Poll until the backend responds (max 30s)
          # Retries every error for ~30 attempts (like the loop it replaced); each
          # attempt is capped at 5s so a server that accepts but never answers can't
          # hold the step until the job timeout.
          if curl -sSfL -o /dev/null --max-time 5 --retry 30 --retry-delay 1 --retry-all-errors \
              http://localhost:4434/api/v2/health; then
            echo 'Backend is ready'
          else
            echo 'Backend did not start in time' >&2
            exit 1
          fi

      # ── Node / Frontend ───────────────────────────────────────────────────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: voter-app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./voter-app

      # ── Playwright ────────────────────────────────────────────────────────────
      # Browser binaries keyed on package-lock.json, where the Playwright
      # version is pinned — a version bump naturally invalidates the cache.
      # `playwright install` still runs unconditionally below: it already
      # skips re-downloading browsers present in this cache dir, but still
      # needs to run apt for --with-deps' system libraries either way.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('voter-app/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: ./voter-app

      # blob replaces the config's html/json (the aggregator merges both shards'
      # blobs back into them, so the flaky check and the html report see the
      # whole suite); list keeps each failing test's name and error in this log.
      - name: Run E2E tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        run: npx playwright test --shard="${SHARD}/${TOTAL}" --reporter=blob,list
        working-directory: ./voter-app
        env:
          CI: 'true'
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}

      - name: Upload the shard's blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.shard }}
          path: voter-app/blob-report/
          if-no-files-found: error
          retention-days: 1

  # The required check. Same condition as the shards: skipped with them on a
  # change e2e doesn't care about (a skipped required check passes, as before).
  e2e-report:
    needs: [changes, e2e]
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'workflow_call' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.relevant == 'true')
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      # merge-reports comes with @playwright/test, so the locked install.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: voter-app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./voter-app

      - name: Download the shards' blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-report-*
          path: voter-app/all-blob-reports
          merge-multiple: true

      # A pattern download succeeds with only one shard's blob, which would leave
      # the merged report (and the flaky check) covering half the suite.
      # --config: the config's own reporters, so results.json lands where
      # check-flaky.mjs reads it, from one source of truth.
      - name: Merge the reports (every shard's blob)
        working-directory: ./voter-app
        env:
          EXPECTED_SHARDS: 2
        run: |
          found=$(find all-blob-reports -name '*.zip' | wc -l)
          if [ "$found" -ne "$EXPECTED_SHARDS" ]; then
            echo "::error::$found blob report(s), expected $EXPECTED_SHARDS: a shard produced no report"
            exit 1
          fi
          npx playwright merge-reports --config playwright.config.ts ./all-blob-reports

      # A test that only passes on its retry is reported green by Playwright.
      # Runs even when the suite failed: the flaky list is useful either way.
      - name: Fail on flaky tests
        if: always()
        run: node scripts/check-flaky.mjs
        working-directory: ./voter-app

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: voter-app/playwright-report/
          retention-days: 7

      # The gate: both shards passed. A failed, cancelled or skipped shard fails
      # this check, whatever the report steps above did.
      - name: All shards passed
        if: always()
        env:
          SHARDS: ${{ needs.e2e.result }}
        run: |
          if [ "$SHARDS" != success ]; then
            echo "::error::the e2e shards ended '$SHARDS', not 'success'"
            exit 1
          fi

  visual-regression:
    # Waits on playwright-image-sync (not just changes): this job is the one
    # actually at risk from a desynced image tag, and a fast, explicit
    # version-mismatch failure here is the whole point of that job -- running
    # them in parallel would still spend the full ~15 minutes on this job's
    # real container pull + Playwright run before its own cryptic
    # missing-browser error, right alongside the fast one.
    needs: [changes, playwright-image-sync]
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'workflow_call' ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.relevant == 'true')
    name: Visual regression (screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pixel comparisons are only meaningful when the baseline PNGs (committed to
    # the repo) and this run render with byte-identical fonts/AA/rasterization —
    # the host runner's own OS image isn't a strong enough guarantee of that on
    # its own (it can and does drift between CI runs with zero code change; see
    # docs/exploration/EXP-004). Pinning the *exact* Playwright Docker image tag
    # matching voter-app/package.json's @playwright/test version sidesteps that
    # entirely: this job's rendering environment is the same byte-for-byte every
    # time it runs, regardless of what `ubuntu-latest` itself resolves to. Keep
    # this tag in lockstep with @playwright/test — a mismatch either fails to
    # find the pre-installed browsers or silently compares against a different
    # renderer than the one that generated the committed baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      # ── Python / backend ───────────────────────────────────────────────────
      # Verified by hand before wiring this: without a live backend,
      # ParliamentCanvas doesn't render a *slightly different* hemicycle, it
      # renders its own "hémicycle indisponible" fallback banner instead of one
      # — baselining that would lock in a permanently-broken-looking state that
      # can never fail again, exactly the blind spot this item exists to close.
      # (LeaderCanvas's default view was checked too and is unaffected — its
      # win-region overlay isn't computed eagerly — but the assembly one
      # genuinely needs this.) See docs/exploration/EXP-004.
      #
      # Same setup-python + setup-uv pairing as the `e2e` job above, same
      # reason (`--system` rejects a uv-managed interpreter, so setup-python
      # provides the real one uv installs into) — even though the container
      # image ships its own python3.12, pinning 3.14 here keeps the backend's
      # runtime identical to every other job that runs it.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: 'fast_api_voter/requirements*.txt'

      - name: Install Python dependencies
        run: uv pip install --system -r fast_api_voter/requirements.lock.txt

      - name: Start FastAPI backend (testing mode)
        run: |
          cd fast_api_voter
          FLASK_ENV=testing \
          uvicorn api.main:app --host 0.0.0.0 --port 4434 &
          # Retries every error for ~30 attempts (like the loop it replaced); each
          # attempt is capped at 5s so a server that accepts but never answers can't
          # hold the step until the job timeout.
          if curl -sSfL -o /dev/null --max-time 5 --retry 30 --retry-delay 1 --retry-all-errors \
              http://localhost:4434/api/v2/health; then
            echo 'Backend is ready'
          else
            echo 'Backend did not start in time' >&2
            exit 1
          fi

      # No setup-node step: the pinned image already ships the Node/npm it was
      # built with, and browsers are pre-installed to match — installing a
      # different Node here wouldn't change that pairing, only risk drifting it.
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./voter-app

      # No `playwright install` needed either — browsers are already present in
      # the image at the exact version this config's @playwright/test expects.
      - name: Run visual regression tests
        run: npx playwright test --config=playwright.visual.config.ts
        working-directory: ./voter-app
        env:
          CI: 'true'

      - name: Upload visual regression report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-visual
          path: voter-app/playwright-report-visual/
          retention-days: 7
