name: E2E Tests

on:
  pull_request:
    branches: [develop]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Python / Flask backend ────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: flask_voter_app/requirements.txt

      - name: Install Python dependencies
        run: pip install -r flask_voter_app/requirements.txt

      - name: Start FastAPI backend (testing mode — SQLite, no Redis)
        run: |
          cd flask_voter_app
          FLASK_ENV=testing \
          JWT_SECRET_KEY=ci-e2e-secret-key \
          uvicorn api.main:app --host 0.0.0.0 --port 4434 &
          # Poll until the backend responds (max 30s)
          python - <<'EOF'
          import urllib.request, time, sys
          for _ in range(30):
              try:
                  urllib.request.urlopen('http://localhost:4434/api/v2/health')
                  print('Backend is ready')
                  sys.exit(0)
              except Exception:
                  time.sleep(1)
          print('Backend did not start in time', file=sys.stderr)
          sys.exit(1)
          EOF

      # ── Node / Frontend ───────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: voter-app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./voter-app

      # ── Playwright ────────────────────────────────────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
        working-directory: ./voter-app

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./voter-app
        env:
          CI: 'true'

      # ── Artifacts ─────────────────────────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: voter-app/playwright-report/
          retention-days: 7
