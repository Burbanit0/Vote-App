name: E2E Tests

on:
  workflow_dispatch:
  # Called from release.yml as the release gate.
  workflow_call:
  # …and on every PR touching either side of the app. It used to be release-only
  # ("exhaustive and slow"), which let the specs rot against a UI that had moved
  # on for two months without anyone noticing. The suite now runs in ~1 min, so
  # it belongs where the drift happens.
  #
  # No `paths:` filter here (moved to the `changes` job below, on purpose): this
  # workflow is a required status check, and a required check scoped by `paths:`
  # at trigger level never even creates a check run on a PR that doesn't touch
  # those paths — which blocks that PR's merge FOREVER (a required check that
  # never reports can't be satisfied). That's exactly what happened to PR #205
  # (a docs/CI-only change) before this workflow was added to required checks.
  # The workflow now always triggers; the real job is skipped instead, which
  # GitHub treats as a passing required check.
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# A newer push to the same branch cancels the previous e2e run.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect e2e-relevant changes
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - 'voter-app/**'
              - 'fast_api_voter/**'
              - '.github/workflows/e2e.yml'

  e2e:
    needs: changes
    # Always run for a manual dispatch or the release-gate call (no paths to
    # filter on); otherwise only when the changes job found something relevant.
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'workflow_call' ||
       needs.changes.outputs.relevant == 'true')
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # ── Python / Flask backend ────────────────────────────────────────────────
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: fast_api_voter/requirements.txt

      - name: Install Python dependencies
        run: pip install -r fast_api_voter/requirements.txt

      # The backend is a fixture here (Assemblée mode and two Laboratoire fiches
      # call /api/v2/*); it is stateless — no DB, no JWT since auth was removed.
      - name: Start FastAPI backend (testing mode)
        run: |
          cd fast_api_voter
          FLASK_ENV=testing \
          uvicorn api.main:app --host 0.0.0.0 --port 4434 &
          # Poll until the backend responds (max 30s)
          python - <<'EOF'
          import urllib.request, time, sys
          for _ in range(30):
              try:
                  urllib.request.urlopen('http://localhost:4434/api/v2/health')
                  print('Backend is ready')
                  sys.exit(0)
              except Exception:
                  time.sleep(1)
          print('Backend did not start in time', file=sys.stderr)
          sys.exit(1)
          EOF

      # ── Node / Frontend ───────────────────────────────────────────────────────
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: voter-app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./voter-app

      # ── Playwright ────────────────────────────────────────────────────────────
      # Browser binaries keyed on package-lock.json, where the Playwright
      # version is pinned — a version bump naturally invalidates the cache.
      # `playwright install` still runs unconditionally below: it already
      # skips re-downloading browsers present in this cache dir, but still
      # needs to run apt for --with-deps' system libraries either way.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('voter-app/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
        working-directory: ./voter-app

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./voter-app
        env:
          CI: 'true'

      # A test that only passes on its retry is reported green by Playwright.
      # Runs even when the suite failed: the flaky list is useful either way.
      - name: Fail on flaky tests
        if: always()
        run: node scripts/check-flaky.mjs
        working-directory: ./voter-app

      # ── Artifacts ─────────────────────────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: voter-app/playwright-report/
          retention-days: 7
