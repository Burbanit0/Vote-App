name: E2E Tests

on:
  pull_request:
    branches: [develop]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # ── Python / Flask backend ────────────────────────────────────────────────
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: fast_api_voter/requirements.txt

      - name: Install Python dependencies
        run: pip install -r fast_api_voter/requirements.txt

      - name: Start FastAPI backend (testing mode — SQLite, no Redis)
        run: |
          cd fast_api_voter
          FLASK_ENV=testing \
          JWT_SECRET_KEY=ci-e2e-secret-key \
          uvicorn api.main:app --host 0.0.0.0 --port 4434 &
          # Poll until the backend responds (max 30s)
          python - <<'EOF'
          import urllib.request, time, sys
          for _ in range(30):
              try:
                  urllib.request.urlopen('http://localhost:4434/api/v2/health')
                  print('Backend is ready')
                  sys.exit(0)
              except Exception:
                  time.sleep(1)
          print('Backend did not start in time', file=sys.stderr)
          sys.exit(1)
          EOF

      # ── Node / Frontend ───────────────────────────────────────────────────────
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: voter-app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./voter-app

      # ── Playwright ────────────────────────────────────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
        working-directory: ./voter-app

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./voter-app
        env:
          CI: 'true'

      # ── Artifacts ─────────────────────────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: voter-app/playwright-report/
          retention-days: 7
