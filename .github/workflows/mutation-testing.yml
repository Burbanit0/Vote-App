name: Mutation Testing

# Separate from Backend CI on purpose (see prompt-mutation-testing.md §3): this
# does not run on pull requests, so it never gates a merge. It DOES gate itself —
# each job now fails when its score drops below a floor set just under the last
# measurement. A score nobody can fail is a score nobody reads.
#
# Two jobs, one per engine, because the project keeps TWO implementations of the
# voting rules in sync (CLAUDE.md, "the dual voting engine"): mutmut mutates the
# Python side, Stryker the TypeScript side. Measuring only one half would leave
# the other free to accumulate tests that execute without asserting — the exact
# blind spot line coverage already has.
on:
  # THIS WORKFLOW HAD NEVER RUN. Not once, since it was added.
  #
  # GitHub resolves `schedule` and `workflow_dispatch` against the DEFAULT branch
  # only. This file lives on develop; the default branch is main, and main is 215
  # commits behind — so the file does not exist where GitHub looks for it. The
  # weekly cron never fired and `gh workflow run` answers 404. A workflow can be
  # configured, plausible and completely inert, which is the same failure mode as
  # the dead simulation worker: the config looked right, nothing ran.
  #
  # `push` and `pull_request`, unlike the two above, use the workflow file from the
  # ref being pushed. So this trigger works today, without waiting for a release.
  # Scoped by `paths` to the two engines: a mutation score can only move when the
  # mutated code moves, so this runs exactly when it has something new to say —
  # which is a better rule than "every Monday" anyway.
  push:
    branches: [develop]
    paths:
      - 'fast_api_voter/api/engine/utils/simulation_ranked_utils.py'
      - 'fast_api_voter/api/engine/utils/simulation_score_utils.py'
      - 'voter-app/src/lib/playgroundVoting.ts'
      - 'fast_api_voter/pyproject.toml'        # [tool.mutmut] scope + test selection
      - 'voter-app/stryker.config.json'
      - 'voter-app/vitest.stryker.config.ts'
      - '.github/workflows/mutation-testing.yml'
  workflow_dispatch: {}
  schedule:
    - cron: '17 4 * * 1'  # Monday 04:17 UTC — off-peak, arbitrary offset to avoid the shared :00 rush

# A full pass is ~40 min per engine. Two engine merges in quick succession would
# otherwise queue two runs whose only difference is the older one being obsolete.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    name: Backend mutation score (mutmut, floor 70%)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: fast_api_voter/requirements.txt

      - name: Install production + dev dependencies
        run: |
          pip install -r fast_api_voter/requirements.txt
          pip install -r fast_api_voter/requirements-dev.txt

      # Scope (which files get mutated, which tests run) lives entirely in
      # fast_api_voter/pyproject.toml's [tool.mutmut] — this step just runs it.
      # continue-on-error: mutmut exits non-zero whenever any mutant survives,
      # which is always. The score is what matters, and the floor below is what
      # judges it — so the run reports, and the next step decides.
      # The log is tee'd because the score is not recoverable from
      # `mutmut results`, which lists only the survivors.
      - name: Run mutmut
        id: mutmut
        continue-on-error: true
        run: |
          cd fast_api_voter
          python -m mutmut run --max-children 4 2>&1 | tee mutmut-run.log

      # Floor set just UNDER the measured score, to lock in what exists rather
      # than to aspire. Measured 2026-08-25 (CI-confirmed, after fixing the
      # test-selection list to include test_anonymity.py + test_cardinal_
      # orphans.py): 1389/1896 killed = 72.9%. Raise it further as the
      # remaining cardinal-rule coverage lands (simulation_score_utils.py is
      # still the weaker half — see the pyproject.toml [tool.mutmut] note).
      - name: Mutation score floor (70%)
        if: always()
        run: ./scripts/check_mutation_score.sh fast_api_voter/mutmut-run.log 70

      - name: Mutation results (survivors + score)
        if: always()
        run: |
          cd fast_api_voter
          {
            echo "## Mutation testing results"
            echo ""
            echo '```'
            python -m mutmut results
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutmut cache (survivor details, for local mutmut show)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutmut-cache
          path: fast_api_voter/.mutmut-cache
          retention-days: 30

  stryker:
    name: Frontend mutation score (Stryker, floor 80%)
    runs-on: ubuntu-latest
    # Stryker's `concurrency` isn't pinned in stryker.config.json, so it
    # defaults to cpuCount - 1: 4 workers on this runner vs 15 on a 16-core
    # dev machine, so a full pass genuinely takes ~2h-2h30 here (~38min
    # locally). Confirmed 2026-08-25 by letting a run go to 71% (1128/1501
    # mutants, Stryker's own ETA ~42min remaining) before cancelling it —
    # not a hang, just less parallelism. This timeout exists so a REAL hang
    # (stuck mutant, runner fault) fails loudly instead of running silently
    # toward GitHub's 360-minute job default and looking identical to "just
    # slow" for hours.
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # @stryker-mutator/core@10.0.0 hard-requires Node >=22 (it throws before
      # running a single mutant otherwise) — every other workflow in this repo
      # pins Node 20, so this job needs its own version, not the project default.
      # Discovered because this gate had never actually passed in CI: it went
      # straight from continue-on-error to a hard `thresholds.break` fail on its
      # very first scheduled/push run, and both looked identical to a genuine
      # mutation-score regression until the log was read.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: voter-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./voter-app

      # Scope (which file gets mutated, which tests run) lives entirely in
      # voter-app/stryker.config.json + vitest.stryker.config.ts — this step
      # just runs it — including `thresholds.break`, which Stryker enforces
      # natively (no continue-on-error, so a drop below the floor fails the job).
      # Set to 76 against a measured 80.82%: under the measure, to lock in what
      # exists rather than to aspire. Target 85 once the spatial-helper and
      # tie-break chantiers land.
      - name: Run Stryker (fails under thresholds.break)
        run: npx stryker run
        working-directory: ./voter-app

      - name: Upload HTML mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-report
          path: voter-app/reports/mutation
          retention-days: 30
