name: Mutation Testing

# Separate from Backend CI on purpose (see prompt-mutation-testing.md §3):
# manual + weekly only, never on push/PR, and never blocking — these jobs
# report a score, they do not gate merges.
#
# Two jobs, one per engine, because the project keeps TWO implementations of the
# voting rules in sync (CLAUDE.md, "the dual voting engine"): mutmut mutates the
# Python side, Stryker the TypeScript side. Measuring only one half would leave
# the other free to accumulate tests that execute without asserting — the exact
# blind spot line coverage already has.
on:
  # THIS WORKFLOW HAD NEVER RUN. Not once, since it was added.
  #
  # GitHub resolves `schedule` and `workflow_dispatch` against the DEFAULT branch
  # only. This file lives on develop; the default branch is main, and main is 215
  # commits behind — so the file does not exist where GitHub looks for it. The
  # weekly cron never fired and `gh workflow run` answers 404. A workflow can be
  # configured, plausible and completely inert, which is the same failure mode as
  # the dead simulation worker: the config looked right, nothing ran.
  #
  # `push` and `pull_request`, unlike the two above, use the workflow file from the
  # ref being pushed. So this trigger works today, without waiting for a release.
  # Scoped by `paths` to the two engines: a mutation score can only move when the
  # mutated code moves, so this runs exactly when it has something new to say —
  # which is a better rule than "every Monday" anyway.
  push:
    branches: [develop]
    paths:
      - 'fast_api_voter/api/engine/utils/simulation_ranked_utils.py'
      - 'fast_api_voter/api/engine/utils/simulation_score_utils.py'
      - 'voter-app/src/lib/playgroundVoting.ts'
      - 'fast_api_voter/pyproject.toml'        # [tool.mutmut] scope + test selection
      - 'voter-app/stryker.config.json'
      - 'voter-app/vitest.stryker.config.ts'
      - '.github/workflows/mutation-testing.yml'
  workflow_dispatch: {}
  schedule:
    - cron: '17 4 * * 1'  # Monday 04:17 UTC — off-peak, arbitrary offset to avoid the shared :00 rush

# A full pass is ~40 min per engine. Two engine merges in quick succession would
# otherwise queue two runs whose only difference is the older one being obsolete.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    name: Backend mutation score (mutmut, non-blocking)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: fast_api_voter/requirements.txt

      - name: Install production + dev dependencies
        run: |
          pip install -r fast_api_voter/requirements.txt
          pip install -r fast_api_voter/requirements-dev.txt

      # Scope (which files get mutated, which tests run) lives entirely in
      # fast_api_voter/pyproject.toml's [tool.mutmut] — this step just runs it.
      # continue-on-error: the whole point of this job is to report a score
      # as a summary/artifact, never to fail the build.
      - name: Run mutmut
        id: mutmut
        continue-on-error: true
        run: |
          cd fast_api_voter
          python -m mutmut run --max-children 4

      - name: Mutation results (survivors + score)
        if: always()
        run: |
          cd fast_api_voter
          {
            echo "## Mutation testing results"
            echo ""
            echo '```'
            python -m mutmut results
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutmut cache (survivor details, for local mutmut show)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutmut-cache
          path: fast_api_voter/.mutmut-cache
          retention-days: 30

  stryker:
    name: Frontend mutation score (Stryker, non-blocking)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: voter-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./voter-app

      # Scope (which file gets mutated, which tests run) lives entirely in
      # voter-app/stryker.config.json + vitest.stryker.config.ts — this step
      # just runs it. continue-on-error for the same reason as mutmut above:
      # `thresholds.break` is null until two real runs give us a defensible
      # number, so today this job reports, it does not gate.
      - name: Run Stryker
        continue-on-error: true
        run: npx stryker run
        working-directory: ./voter-app

      - name: Upload HTML mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stryker-report
          path: voter-app/reports/mutation
          retention-days: 30
