name: 🚀 Release Vote Lab

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Type de version'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch    # 1.0.0 → 1.0.1  (bugfix)
          - minor    # 1.0.0 → 1.1.0  (nouvelle feature)
          - major    # 1.0.0 → 2.0.0  (changement majeur)
      release_notes:
        description: 'Notes de release (optionnel — GitHub génère les siennes sinon)'
        required: false
        type: string

# cancel-in-progress: false — a second dispatch queues behind the first
# instead of racing it. Cancelling mid-run here could kill the job between
# `git tag`/`git push` and GitHub Release creation, leaving a tag with no
# published release behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── 1. CI — tests must pass before any release ─────────────────────────────
  ci-frontend:
    name: Tests frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: voter-app/package-lock.json
      - run: npm ci
        working-directory: ./voter-app
      - run: npm test
        working-directory: ./voter-app
        env:
          CI: 'true'

  ci-backend:
    name: Tests backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # No `python-version` here — see backend-ci-cd-pipeline.yml's comment on
      # this same pairing (`--system` rejects a uv-managed interpreter).
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: 'fast_api_voter/requirements*.txt'
      - run: |
          uv pip install --system -r fast_api_voter/requirements.txt
          uv pip install --system pytest pytest-cov
      - run: python -m pytest fast_api_voter/api/tests -v
        env:
          FLASK_ENV: testing

  # E2E (Playwright) was previously wired to nothing (workflow_dispatch only)
  # despite being the repo's one exhaustive, end-to-end check. It's too slow
  # to run on every develop PR, but a release is exactly the infrequent,
  # can-afford-to-be-slow moment it belongs at — see e2e.yml's own comment.
  e2e:
    name: E2E (Playwright)
    uses: ./.github/workflows/e2e.yml

  # ── 2. Release — only if CI + E2E all pass ─────────────────────────────────
  release:
    name: Créer la release
    needs: [ci-frontend, ci-backend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # needed to push tags and create releases

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # This job always tags/pushes `main`, regardless of which ref the
      # workflow_dispatch was actually fired against — ci-frontend/ci-backend/
      # e2e above test whatever ref the dispatch used, not necessarily `main`.
      # Since the repo's default branch is `develop`, a dispatch without an
      # explicit `--ref main` (e.g. `gh workflow run release.yml -f ...` from
      # the wrong directory, or the GitHub UI defaulting its branch picker)
      # would test develop's code but tag/ship main's — code that was never
      # actually run through CI here. Fail loudly instead: the commit that
      # triggered this run must already be reachable from `main`, which is
      # only true once the develop → main PR (see the `release` skill) has
      # merged and this was dispatched with `--ref main`.
      - name: Verify the triggering commit is already on main
        run: |
          if ! git merge-base --is-ancestor "${{ github.sha }}" HEAD; then
            echo "::error::main does not contain ${{ github.sha }} (the commit that triggered this run). This job always tags main directly, so releasing now would ship untested code. Merge develop -> main first (see the release skill), then re-dispatch with --ref main." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: voter-app/package-lock.json

      - name: Bump version in package.json
        id: bump
        working-directory: ./voter-app
        env:
          VERSION_TYPE: ${{ inputs.version_type }}   # via env (constrained choice, but never interpolate into the shell)
        run: |
          npm version "$VERSION_TYPE" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Bumped to v${VERSION}"

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit + tag + push
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git add voter-app/package.json voter-app/package-lock.json
          git commit -m "chore: bump to ${VERSION} [skip ci]"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin main --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          name: "🗳️ Vote Lab ${{ steps.bump.outputs.version }}"
          body: |
            ## Vote Lab ${{ steps.bump.outputs.version }}

            ${{ inputs.release_notes != '' && inputs.release_notes || 'Voir les commits ci-dessous pour le détail des changements.' }}

            ---
            **Liens**
            - 📖 [Référence théorique](THEORY.md)
            - 🐛 [Signaler un bug](../../issues/new)
          generate_release_notes: true   # GitHub auto-generates changelog from commits
          make_latest: true
