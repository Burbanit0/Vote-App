name: 🚀 Release Vote Lab

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notes de release (optionnel — GitHub génère les siennes sinon)'
        required: false
        type: string

# cancel-in-progress: false — a second dispatch queues behind the first
# instead of racing it. Cancelling mid-run here could kill the job between
# `git tag`/`git push` and GitHub Release creation, leaving a tag with no
# published release behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── 1. CI — tests must pass before any release ─────────────────────────────
  ci-frontend:
    name: Tests frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: voter-app/package-lock.json
      - run: npm ci
        working-directory: ./voter-app
      # test:coverage enforces the coverage thresholds; build runs tsc and the
      # 1 MB size-limit, neither of which vitest or the e2e build checks.
      - run: npm run test:coverage && npm run build
        working-directory: ./voter-app
        env:
          CI: 'true'

  ci-backend:
    name: Tests backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # No `python-version` here — see backend-ci-cd-pipeline.yml's comment on
      # this same pairing (`--system` rejects a uv-managed interpreter).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: 'fast_api_voter/requirements*.txt'
      # Same install and pytest steps as backend-ci-cd-pipeline.yml (hand-kept in
      # sync: the first real dispatch, v0.2.0, died here collecting the
      # hypothesis/schemathesis/z3 modules because this job installed only
      # requirements.txt + pytest). Run from fast_api_voter/: pyproject's
      # --ignore paths resolve against the cwd.
      - run: uv pip install --system -r fast_api_voter/requirements-dev.lock.txt
      - run: python -m pytest api/tests -v -n auto
        working-directory: fast_api_voter
        env:
          APP_ENV: testing
      - name: Engine perf ceilings (pytest-benchmark)
        run: python -m pytest api/tests/test_engine_benchmarks.py -v -o addopts=""
        working-directory: fast_api_voter

  # E2E (Playwright) gates every PR too (CLAUDE.md), but pushes to main skip
  # it, so the release re-runs it on the exact commit it tags.
  e2e:
    name: E2E (Playwright)
    uses: ./.github/workflows/e2e.yml

  # ── 2. Release — only if CI + E2E all pass ─────────────────────────────────
  release:
    name: Créer la release
    needs: [ci-frontend, ci-backend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # needed to push tags and create releases

    steps:
      - name: Checkout main # zizmor: ignore[artipacked] this job pushes the release tag with the checkout token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # This job always tags `main`, regardless of which ref the
      # workflow_dispatch was actually fired against — ci-frontend/ci-backend/
      # e2e above test whatever ref the dispatch used, not necessarily `main`.
      # Since the repo's default branch is `develop`, a dispatch without an
      # explicit `--ref main` (e.g. `gh workflow run release.yml -f ...` from
      # the wrong directory, or the GitHub UI defaulting its branch picker)
      # would test develop's code but tag/ship main's — code that was never
      # actually run through CI here. Fail loudly instead: the commit that
      # triggered this run must already be reachable from `main`, which is
      # only true once the develop → main PR (see the `release` skill) has
      # merged and this was dispatched with `--ref main`.
      # Exact match, not ancestry: an ancestor check passes when main moved
      # during CI, which would tag commits this run never tested.
      - name: Verify main is exactly the commit that was tested
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            echo "::error::main is at $(git rev-parse HEAD), but this run tested ${{ github.sha }}. This job always tags main directly, so releasing now would ship untested code. Merge develop -> main first (see the release skill), then dispatch a fresh run with --ref main (not a re-run)." >&2
            exit 1
          fi

      # main is protected (PRs only, admins included), so this job no longer
      # commits a version bump to it: the version is whatever
      # voter-app/package.json says on main, set by a bump PR that went
      # polity -> develop -> main like any other change (see the release
      # skill). The job only pushes a tag, which branch protection doesn't
      # cover. An existing tag on another commit fails here (that version was
      # already released); one already on this commit, a re-run after a failed
      # release step, is reused.
      - name: Read the version to release
        id: version
        run: |
          VERSION="v$(jq -r .version voter-app/package.json)"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::voter-app/package.json has version '${VERSION#v}', expected X.Y.Z." >&2
            exit 1
          fi
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            git fetch --quiet --no-tags origin "+refs/tags/${VERSION}:refs/tags/${VERSION}"
            if [ "$(git rev-parse "refs/tags/${VERSION}^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::${VERSION} is already tagged on another commit. Bump voter-app/package.json in a PR to polity (npm version <patch|minor|major> --no-git-tag-version), carry it to main, then dispatch again." >&2
              exit 1
            fi
            # A re-run after the tag push but before the release was created.
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 2 ]; then
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not list the remote tags (git ls-remote exit ${rc}); re-run this job." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION}"

      - name: Configure git identity
        if: steps.version.outputs.tagged == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag + push the tag
        if: steps.version.outputs.tagged == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "refs/tags/${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "🗳️ Vote Lab ${{ steps.version.outputs.version }}"
          body: |
            ## Vote Lab ${{ steps.version.outputs.version }}

            ${{ inputs.release_notes != '' && inputs.release_notes || 'Voir les commits ci-dessous pour le détail des changements.' }}

            ---
            **Liens**
            - 📖 [Référence théorique](${{ github.server_url }}/${{ github.repository }}/blob/${{ steps.version.outputs.version }}/THEORY.md)
            - 🐛 [Signaler un bug](${{ github.server_url }}/${{ github.repository }}/issues/new)
          generate_release_notes: true   # GitHub auto-generates changelog from commits
          make_latest: true
