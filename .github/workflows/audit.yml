name: Security Audit

# Supplementary SECURITY scanning only. The repo's lint/type/test gates already
# live in backend-ci-cd-pipeline.yml + frontend-ci-cd-pipeline.yml (ruff, mypy,
# pytest, bandit, pip-audit, eslint, tsc) — this workflow adds SAST / secret / CVE
# coverage they don't have: Semgrep, Gitleaks, Trivy, CodeQL.
#
# PUBLIC-REPO MODE: code scanning is free, so each scanner uploads SARIF to the
# GitHub Security tab (in addition to the downloadable artifact), and a CodeQL job
# runs the native analysis. The strict gates still fail the build: Semgrep findings,
# Trivy HIGH/CRITICAL, and any detected secret.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC
  # Required by GitHub's merge queue: once enabled on `develop`, each queued
  # PR is re-tested against the up-to-date base via this event before it
  # actually merges. All 4 required-check jobs here (Semgrep SAST, Secret
  # Scan, Dependencies/Containers & Misconfig, Code Quality — see
  # scripts/setup-branch-protection.sh) are pure code scans, safe to rerun
  # under any event. branch-policy.yml deliberately does NOT get this
  # trigger: it reads github.head_ref / the PR title, neither of which
  # exists in the merge_group context, and re-validating branch naming on
  # a merge-queue's temporary commit is meaningless anyway (it already
  # passed that check to enter the queue).
  merge_group:

permissions:
  contents: read
  security-events: write # upload SARIF to the Security tab (Semgrep, Trivy, CodeQL)
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.14", cache: "pip" }
      - run: pip install semgrep
      # Strict: --error makes Semgrep exit non-zero on any finding → the job fails.
      # The report is still uploaded (if: always()) so findings are downloadable.
      - name: Run Semgrep (gating)
        run: |
          semgrep \
            --config=p/python --config=p/javascript --config=p/react \
            --config=p/security-audit --config=p/secrets \
            --config=p/sql-injection --config=p/owasp-top-ten \
            --config=.semgrep/vote-app-rules.yml \
            --sarif-output=semgrep.sarif --json-output=semgrep.json \
            --error --metrics=off
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-report
          path: |
            semgrep.sarif
            semgrep.json
          if-no-files-found: ignore
      # Feed the Security tab too (best-effort: never let a SARIF-upload hiccup
      # mask the gate above — the `semgrep --error` step is the real gate).
      - name: Upload Semgrep SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml # default ruleset + triaged FP allowlist

  # ---------------------------------------------------------------
  trivy:
    name: Dependencies, Containers & Misconfig
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # 1) Non-gating JSON report → uploaded as an artifact (always).
      - name: Trivy (JSON report artifact)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: json
          output: trivy.json
          exit-code: "0"
          skip-dirs: voter-app/node_modules,.claude,graphify-out
          trivyignores: .trivyignore.yaml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-report
          path: trivy.json
          if-no-files-found: ignore
      # 1b) SARIF report → Security tab (non-gating).
      - name: Trivy (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          skip-dirs: voter-app/node_modules,.claude,graphify-out
          trivyignores: .trivyignore.yaml
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          sarif_file: trivy.sarif
          category: trivy
      # 2) Strict gate: fail the job on any HIGH/CRITICAL (table to the log).
      #    `if: always()` so the gate runs even if the best-effort upload above hiccups.
      - name: Trivy (gating)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          skip-dirs: voter-app/node_modules,.claude,graphify-out
          trivyignores: .trivyignore.yaml

  # ---------------------------------------------------------------
  # Built-image scan + SBOM. Neither Dockerfile is exercised by any other
  # workflow — the `trivy` job above only scans the filesystem, never a built
  # image, so the actual base images (python:3.11-slim, node:20,
  # nginxinc/nginx-unprivileged:alpine) and whatever the multi-stage builds
  # layer on top were previously unscanned and could silently bit-rot.
  #
  # Building + scanning 2 images adds several minutes, so this stays off the
  # normal PR loop on purpose — only the weekly cron and pushes to `develop`
  # pay for it (a code review or a hotfix PR shouldn't wait on a Node/Python
  # base-image scan that has nothing to do with the diff).
  #
  # NON-GATING for now, unlike the filesystem trivy job above: a first run
  # would immediately surface whatever base-image CVEs exist today, most of
  # them the upstream image's problem, not something a single PR can fix —
  # gating on day one would just block develop indefinitely. Findings land in
  # the Security tab; promote to gating once a triage pass + .trivyignore
  # entries (mirroring the fs job's existing pattern) clears the backlog.
  image-scan:
    name: Docker image scan & SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    # Job-level permissions REPLACE the workflow-level block above for this job
    # alone (GitHub Actions semantics: job `permissions:` is not additive), so
    # the first three restate exactly what this job already had by inheritance
    # (`security-events: write` for the Trivy image-SARIF upload a few steps
    # down, `actions: read` from the workflow default, unrelated to signing).
    # `id-token: write` + `attestations: write` are the two new grants, same
    # minimal-scoped-to-the-job pattern scorecard.yml already uses for its own
    # `id-token: write` (there: publish to the public Scorecard API; here: mint
    # a short-lived OIDC token for cosign keyless signing, and let
    # attest-build-provenance write to this repo's Attestations API).
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: fast_api_voter/Dockerfile.prod
            context: fast_api_voter
            tag: votelab-backend:scan
          - name: frontend
            dockerfile: voter-app/Dockerfile
            context: voter-app
            tag: votelab-frontend:scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # GHA-backed layer cache (Lot 1, PLAN_SOLIDITE_TECHNIQUE.md): this job
      # only runs on the weekly cron + push-to-develop (see the job comment
      # above), so a cold cache would otherwise redownload base images and
      # reinstall every dependency on every run regardless of how little the
      # Dockerfile changed week to week. `load: true` keeps the image in the
      # local daemon (needed by Trivy/SBOM below) since this job only scans,
      # it never pushes.
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.tag }}
          load: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Trivy (image scan, non-gating for now — see job comment)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          scan-type: image
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image-${{ matrix.name }}.sarif
          exit-code: "0"
      - name: Upload Trivy image SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          sarif_file: trivy-image-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}

      - name: Generate SBOM (SPDX)
        if: always()
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ matrix.tag }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json

      # Signature + SLSA provenance (Lot 9, PLAN_SOLIDITE_TECHNIQUE.md) — the
      # logical next step after the SBOM above. Neither image is ever pushed
      # to a registry (`docker/build-push-action` above uses `load: true`,
      # confirmed by grepping every workflow in this repo for a registry
      # login/push step: there is none), so signing "the image" in the
      # OCI-native sense (`cosign sign`, which pushes a `.sig` artifact next
      # to the image *in a registry*) has no destination to sign into — it
      # would sign something nobody can ever pull and verify. What IS
      # actually published outside this job is the SBOM file itself (the
      # `upload-artifact` step below, downloadable from the run). So that's
      # what gets signed: `cosign sign-blob` (not `cosign attest`, which is
      # for typed in-toto predicates about a subject, not signing the
      # artifact's own bytes) over the SBOM, keyless via this job's OIDC
      # token (no key material to manage or leak) — proving the SBOM
      # downloaded from this run is byte-for-byte what this workflow, at this
      # commit, produced. See docs/exploration/EXP-008 for the full
      # investigation (why the image can't be the subject, the sign-vs-attest
      # distinction, and a real tamper test against a local key run by hand
      # before wiring this in) and PLAN_SOLIDITE_TECHNIQUE.md's Lot 9 détail
      # for the "is anything actually published here" finding.
      - name: Install cosign
        if: always()
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SBOM (cosign, keyless via OIDC)
        if: always()
        run: |
          cosign sign-blob --yes \
            --bundle sbom-${{ matrix.name }}.spdx.json.cosign.bundle \
            sbom-${{ matrix.name }}.spdx.json

      # SLSA build provenance for the SBOM (which build, which commit, which
      # workflow produced it) — GitHub's own attestation action, not the
      # `slsa-framework/slsa-github-generator` reusable-workflow builder: that
      # project's own README now says "no longer actively maintained... we
      # are working on guidance and simpler tooling to replace it" (last
      # release Feb 2025) and points at GitHub artifact attestations as that
      # replacement — confirmed by reading the README directly before
      # choosing, not assumed. It also only reaches its strongest (SLSA v1
      # Build L3) guarantee by moving the build into an isolated reusable
      # workflow it controls, which this job — a plain `docker build` inside
      # a normal job — isn't, and restructuring it for that guarantee isn't
      # worth the disruption for an M-effort item. `attest-build-provenance`
      # auto-generates a correct SLSA predicate from the real run context
      # (no hand-written predicate to keep in sync, unlike a manual `cosign
      # attest-blob`), and needs no registry either — `subject-path` hashes
      # the file directly.
      - name: Attest SLSA build provenance (SBOM)
        if: always()
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom-${{ matrix.name }}.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom-${{ matrix.name }}
          path: |
            sbom-${{ matrix.name }}.spdx.json
            sbom-${{ matrix.name }}.spdx.json.cosign.bundle
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # Code Quality — dead code, unused deps, cross-language duplication,
  # cyclomatic complexity.
  # The tools themselves stay NON-GATING (the repo never did a full cleanup
  # pass, and failing on the existing backlog would just get the job disabled).
  # What gates is the RATCHET at the end: scripts/check_quality_ratchet.sh reads
  # the .txt files tee'd below and fails if any count grew. Debt may shrink,
  # never grow — a signal that can never fail is a signal nobody reads.
  code-quality:
    name: Code Quality (dead code, duplication & complexity)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.14" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: voter-app/package-lock.json

      - name: Install vulture, radon, xenon
        run: pip install vulture==2.16 radon==6.0.1 xenon==0.9.3

      - name: Python dead code (vulture)
        working-directory: fast_api_voter
        continue-on-error: true
        run: python -m vulture api/ .vulture_whitelist.py --config pyproject.toml | tee vulture.txt

      - name: Python cyclomatic complexity (radon)
        working-directory: fast_api_voter
        continue-on-error: true
        run: python -m radon cc api/ -e "api/tests/*" -n C -s | tee radon.txt

      - name: Python cyclomatic complexity (xenon)
        working-directory: fast_api_voter
        continue-on-error: true
        # Reporting only, and it must stay non-blocking: the knip and jscpd steps
        # below have no `if: always()`, so a hard failure here would skip them and
        # leave the ratchet with missing input files. The gate lives at the end of
        # the job instead.
        run: python -m xenon api/ -e "api/tests/*" -b F -m F -a F | tee xenon.txt

      # deptry needs the actual dependencies installed (it maps import names
      # to installed package metadata) — unlike vulture/radon/xenon above,
      # which only need the source. Same install this job already runs, just
      # for a different tool; not needed until this step.
      - name: Install backend dependencies (for deptry)
        working-directory: fast_api_voter
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Python unused/undeclared dependencies (deptry)
        working-directory: fast_api_voter
        continue-on-error: true
        run: python -m deptry . | tee deptry.txt

      - name: Install frontend deps
        working-directory: voter-app
        run: npm ci --no-audit --no-fund

      - name: TypeScript dead code & unused deps (knip)
        working-directory: voter-app
        continue-on-error: true
        run: npx knip --no-progress | tee knip.txt

      - name: Cross-language duplication (jscpd)
        continue-on-error: true
        run: npx --yes jscpd --config .jscpd.json fast_api_voter/api voter-app/src | tee jscpd.txt

      # THE gating step of this job. Every tool above stays non-blocking; this
      # compares their counts to .github/quality-baseline.json and fails only on
      # an INCREASE. Existing debt is grandfathered, new debt is not — see the
      # header of the script. `if: always()` so it still runs when a tool step
      # above exited non-zero (they all do, that's what continue-on-error means).
      - name: Quality ratchet (debt may shrink, never grow)
        if: always()
        run: ./scripts/check_quality_ratchet.sh

      # The second gating step, and deliberately only the AVERAGE. -a A passes
      # today (measured), so this locks the codebase-wide average at rank A for
      # free: the repo can no longer drift complex as a whole, even while
      # individual functions stay bad.
      # -b and -m stay at F (never fail) on purpose — 9 functions are rank F and
      # 20 rank E, so a per-block gate would fail on the existing backlog and get
      # switched off within a week, which is how a gate becomes decoration.
      # -b tightens to D once those are decomposed; until then the radon count in
      # the ratchet above is what stops new complex functions being added.
      # Runs at the end, after the reporting steps, so a failure here cannot skip
      # the tool steps the ratchet reads.
      - name: Complexity gate (xenon — average must stay rank A)
        if: always()
        working-directory: fast_api_voter
        run: python -m xenon api/ -e "api/tests/*" -b F -m F -a A

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### Code Quality (raw tool output — the ratchet step is what gates)"
            echo
            echo "<details><summary>vulture (Python dead code)</summary>"
            echo; echo '```'; cat fast_api_voter/vulture.txt 2>/dev/null || echo "(no output)"; echo '```'
            echo "</details>"
            echo "<details><summary>radon (Python cyclomatic complexity, rank C+)</summary>"
            echo; echo '```'; cat fast_api_voter/radon.txt 2>/dev/null || echo "(no output)"; echo '```'
            echo "</details>"
            echo "<details><summary>xenon (radon threshold summary)</summary>"
            echo; echo '```'; cat fast_api_voter/xenon.txt 2>/dev/null || echo "(no output)"; echo '```'
            echo "</details>"
            echo "<details><summary>knip (TS dead code / unused deps)</summary>"
            echo; echo '```'; cat voter-app/knip.txt 2>/dev/null || echo "(no output)"; echo '```'
            echo "</details>"
            echo "<details><summary>deptry (Python unused/undeclared deps)</summary>"
            echo; echo '```'; cat fast_api_voter/deptry.txt 2>/dev/null || echo "(no output)"; echo '```'
            echo "</details>"
            echo "<details><summary>jscpd (duplication)</summary>"
            echo; echo '```'; cat jscpd.txt 2>/dev/null || echo "(no output)"; echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: code-quality-report
          path: |
            fast_api_voter/vulture.txt
            fast_api_voter/radon.txt
            fast_api_voter/xenon.txt
            voter-app/knip.txt
            fast_api_voter/deptry.txt
            jscpd.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # CodeQL — GitHub's native code scanning (free on public repos). Results land
  # in the Security tab. Non-gating by itself; severities show up as alerts.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          category: "/language:${{ matrix.language }}"
