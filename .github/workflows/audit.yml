name: Security Audit

# Supplementary SECURITY scanning only. The repo's lint/type/test gates already
# live in backend-ci-cd-pipeline.yml + frontend-ci-cd-pipeline.yml (flake8, mypy,
# pytest, bandit, pip-audit, eslint, tsc) — this workflow adds SAST / secret / CVE
# coverage they don't have: Semgrep, Gitleaks, Trivy, CodeQL.
#
# PUBLIC-REPO MODE: code scanning is free, so each scanner uploads SARIF to the
# GitHub Security tab (in addition to the downloadable artifact), and a CodeQL job
# runs the native analysis. The strict gates still fail the build: Semgrep findings,
# Trivy HIGH/CRITICAL, and any detected secret.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC

permissions:
  contents: read
  security-events: write # upload SARIF to the Security tab (Semgrep, Trivy, CodeQL)
  actions: read

jobs:
  # ---------------------------------------------------------------
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - run: pip install semgrep
      # Strict: --error makes Semgrep exit non-zero on any finding → the job fails.
      # The report is still uploaded (if: always()) so findings are downloadable.
      - name: Run Semgrep (gating)
        run: |
          semgrep \
            --config=p/python --config=p/javascript --config=p/react \
            --config=p/security-audit --config=p/secrets \
            --config=p/sql-injection --config=p/owasp-top-ten \
            --sarif-output=semgrep.sarif --json-output=semgrep.json \
            --error --metrics=off
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-report
          path: |
            semgrep.sarif
            semgrep.json
          if-no-files-found: ignore
      # Feed the Security tab too (best-effort: never let a SARIF-upload hiccup
      # mask the gate above — the `semgrep --error` step is the real gate).
      - name: Upload Semgrep SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml # default ruleset + triaged FP allowlist

  # ---------------------------------------------------------------
  trivy:
    name: Dependencies, Containers & Misconfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # 1) Non-gating JSON report → uploaded as an artifact (always).
      - name: Trivy (JSON report artifact)
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: json
          output: trivy.json
          exit-code: "0"
          skip-dirs: voter-app/node_modules,.claude,graphify-out
          trivyignores: .trivyignore.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-report
          path: trivy.json
          if-no-files-found: ignore
      # 1b) SARIF report → Security tab (non-gating).
      - name: Trivy (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          skip-dirs: voter-app/node_modules,.claude,graphify-out
          trivyignores: .trivyignore.yaml
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        with:
          sarif_file: trivy.sarif
          category: trivy
      # 2) Strict gate: fail the job on any HIGH/CRITICAL (table to the log).
      #    `if: always()` so the gate runs even if the best-effort upload above hiccups.
      - name: Trivy (gating)
        if: always()
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          skip-dirs: voter-app/node_modules,.claude,graphify-out
          trivyignores: .trivyignore.yaml

  # ---------------------------------------------------------------
  # Code Quality — dead code, unused deps, cross-language duplication.
  # NON-GATING: these three tools were only just added (see CODE_AUDIT.md)
  # and the repo hasn't done its first cleanup pass yet. Findings are published
  # to the run's job summary so they stay visible without failing anyone's
  # build; promote to a gating step once the backlog is near zero.
  code-quality:
    name: Code Quality (dead code & duplication)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: voter-app/package-lock.json

      - name: Install vulture
        run: pip install vulture==2.16

      - name: Python dead code (vulture)
        working-directory: fast_api_voter
        continue-on-error: true
        run: python -m vulture api/ .vulture_whitelist.py --config pyproject.toml | tee vulture.txt

      - name: Install frontend deps
        working-directory: voter-app
        run: npm ci --no-audit --no-fund

      - name: TypeScript dead code & unused deps (knip)
        working-directory: voter-app
        continue-on-error: true
        run: npx knip --no-progress | tee knip.txt

      - name: Cross-language duplication (jscpd)
        continue-on-error: true
        run: npx --yes jscpd --config .jscpd.json fast_api_voter/api voter-app/src | tee jscpd.txt

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### Code Quality (informational — never fails this job)"
            echo
            echo "<details><summary>vulture (Python dead code)</summary>"
            echo; echo '```'; cat fast_api_voter/vulture.txt 2>/dev/null || echo "(no output)"; echo '```'
            echo "</details>"
            echo "<details><summary>knip (TS dead code / unused deps)</summary>"
            echo; echo '```'; cat voter-app/knip.txt 2>/dev/null || echo "(no output)"; echo '```'
            echo "</details>"
            echo "<details><summary>jscpd (duplication)</summary>"
            echo; echo '```'; cat jscpd.txt 2>/dev/null || echo "(no output)"; echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: code-quality-report
          path: |
            fast_api_voter/vulture.txt
            voter-app/knip.txt
            jscpd.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # CodeQL — GitHub's native code scanning (free on public repos). Results land
  # in the Security tab. Non-gating by itself; severities show up as alerts.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
      - name: Analyze
        uses: github/codeql-action/analyze@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        with:
          category: "/language:${{ matrix.language }}"
