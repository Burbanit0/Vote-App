name: CI Health Watchdog

# Catches a non-required workflow, or develop's branch protection, rotting
# silently -- mutmut crashed on every run for 17 days (2026-08-29 ->
# 2026-09-13) before anyone noticed, because it's deliberately not a
# required check (mutation-testing.yml never runs on `pull_request`, and a
# required check on a workflow that never triggers on a PR blocks every PR
# forever -- see scripts/setup-branch-protection.sh's own comment). The same
# day's audit also found develop's branch protection had silently drifted
# from what that script documents. Both are the same disease: state that
# only a human remembering to look would catch. See
# scripts/check_ci_health.py's module docstring for the full design,
# including why the watcher itself can't be allowed to die quietly.

on:
  schedule:
    - cron: '7 8 * * *'  # daily, off-peak, distinct from every other cron in this repo
  workflow_dispatch: {}
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  # Writes the snapshot. Never runs on pull_request -- it's the thing being
  # watched, not the watcher (same reasoning as mutation-testing.yml/
  # schemathesis.yml never gating a PR).
  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: CI health audit (writes snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # token: CI_HEALTH_PAT, not the default GITHUB_TOKEN, for the whole
      # job's git credentials -- GitHub deliberately never triggers new
      # workflow runs from a commit or PR authored by GITHUB_TOKEN (its own
      # anti-recursion rule, confirmed live the hard way: PR #453 sat with
      # ZERO check runs, ever, until a human-authored commit on the same
      # branch triggered a real run immediately). A PR whose own required
      # checks can never run can never be merged, so the snapshot PR this
      # job opens would be permanently stuck without a human manually
      # pushing an extra commit every single time -- exactly the automation
      # this mechanism exists to provide. CI_HEALTH_PAT is a fine-grained
      # PAT scoped to only this repo, with only Contents: read/write and
      # Pull requests: read/write -- see the voter-ci skill for how to
      # (re)create and rotate it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: develop
          token: ${{ secrets.CI_HEALTH_PAT }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Run the audit
        id: audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # read-only queries -- least privilege, no need for the PAT here
        run: |
          python scripts/check_ci_health.py --update | tee summary.txt
          {
            echo "## CI health audit"
            echo ""
            echo '```'
            cat summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # A direct push here was the original design, matching what looked
      # like release.yml's precedent (push straight to a protected branch).
      # That precedent turned out to be untested and wrong: develop's
      # required_pull_request_reviews block (even at 0 required approvals)
      # makes GitHub reject ANY raw push with "Changes must be made through
      # a pull request" -- confirmed live (this job's first real run, 2026-
      # 09-13), regardless of which token pushes it. The only legitimate
      # path is the same one every other change in this repo takes: a PR.
      # Only opened if something actually changed -- a no-op run shouldn't
      # spam a PR just to bump a timestamp.
      #
      # Deliberately NOT auto-queued: an earlier version had this job post
      # `@mergifyio queue` on its own PR. Mergify refused it outright --
      # "Command disallowed due to command restrictions" -- because letting
      # a bot comment its own PR into the merge queue is exactly the
      # self-merge path Mergify's command restrictions exist to block. That
      # is correct behavior, not a bug to route around: a human queues or
      # merges this PR, same as reviewing any other change. The existing
      # staleness check in `verify` is the real backstop if even that goes
      # unnoticed -- every PR starts failing after ~36h of silence, which is
      # a much louder signal than an unmerged PR sitting quietly.
      - name: Open a PR with the updated snapshot, if it changed
        env:
          GH_TOKEN: ${{ secrets.CI_HEALTH_PAT }}
        run: |
          git add .github/ci-health.json
          if git diff --cached --quiet; then
            echo "No change to .github/ci-health.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/ci-health-snapshot-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "chore(ci-health): update snapshot"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base develop --head "$BRANCH" \
            --title "chore(ci-health): update snapshot" \
            --body "Automated snapshot from the scheduled CI health audit (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Needs a human to review and queue/merge -- Mergify won't accept a queue command from this bot.")
          echo "Opened $PR_URL -- needs a human to queue/merge it."

  # The actual gate. Required on every PR. Reads the snapshot from develop's
  # tip (not the PR branch's own possibly-months-stale copy -- this is
  # metadata ABOUT the repo's CI health, not something that varies with the
  # PR's own diff, so every PR should see the same, freshest read) plus the
  # PR's OWN .github/ci-health-snoozes.json (so a PR can add or renew a
  # snooze and see it take effect on itself immediately, same as any other
  # reviewed change). No `changes`/paths-filter gate at all, unlike
  # backend/frontend/e2e/openapi-contract: this check is cheap (a JSON read
  # and some date arithmetic, no dependency install), so there's no reason
  # to skip it ever -- which also means it can't hit PR #205's failure mode
  # (a required check whose workflow never creates a run on some PRs).
  verify:
    name: CI health check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # Bootstrap case: the PR that introduces this file has nothing on
      # develop yet to read (the audit job hasn't run for real until this
      # merges and its first schedule/dispatch fires) -- that's a one-time
      # gap, not a health problem, so it passes with a notice instead of
      # failing on a missing path.
      - name: Fetch the latest snapshot from develop
        id: fetch
        run: |
          git fetch --depth=1 origin develop
          if git show origin/develop:.github/ci-health.json > /tmp/ci-health.json 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify
        if: steps.fetch.outputs.found == 'true'
        run: python scripts/check_ci_health.py --verify --snapshot /tmp/ci-health.json
      - name: Bootstrap notice
        if: steps.fetch.outputs.found == 'false'
        run: echo "No .github/ci-health.json on develop yet -- nothing to verify until this mechanism's first PR merges and its scheduled audit runs."
