name: Human review attestation

# Binds a maintainer's review to one commit. .mergify.yml holds high-risk PRs
# until the head commit carries a successful `human-review` status; this
# workflow posts it.
#
#  - The repository owner comments `/reviewed <sha>` on the PR, naming the head
#    commit they reviewed (7+ hex chars). If that is still the head, post
#    `human-review` = success on it. Naming the SHA matters: a commit pushed
#    while the owner was reading the diff is not approved by accident, which a
#    label or a bare "LGTM" could not tell apart.
#  - Mergify's own update of an approved head (strict mode keeping a queued PR
#    up to date) carries the approval over only when the new head is a merge
#    whose first parent is the approved head and whose other parent is already
#    on the base branch, i.e. it adds nothing that hasn't merged through its
#    own checks.
#  - Any other new commit gets nothing, so the PR is held again. There is no
#    reset step that could be skipped.
#
# Both triggers run the workflow from a branch the PR cannot edit:
# issue_comment from the default branch, pull_request_target from the base.
# No PR code is checked out or executed; untrusted event fields only reach the
# shell through env.
#
# Limits, stated in .mergify.yml too: anyone able to run a workflow in this
# repo can post a status with this name, so this guards against accidental and
# lazy merges, not deliberate forgery. And an agent using the owner's own
# credentials can comment as the owner; that has to be denied on the agent
# side (Claude Code permissions), not here.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [synchronize]
    branches: [develop, polity]

permissions:
  contents: read

jobs:
  attest:
    name: Record the review on the named commit
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/reviewed')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: human-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      statuses: write
      issues: write # PR comments go through the issues API
      pull-requests: read
    steps:
      - name: Check the commenter and the SHA, then post the status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.comment.user.login }}
          BODY: ${{ github.event.comment.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reply() { gh api "repos/$REPO/issues/$PR/comments" -f body="$1" > /dev/null; }
          if [ "$AUTHOR" != "$OWNER" ]; then
            reply "\`/reviewed\` from @$AUTHOR ignored: only @$OWNER can approve a high-risk change."
            exit 0
          fi
          named=$(printf '%s\n' "$BODY" | head -n1 | sed -nE 's#^/reviewed[[:space:]]+([0-9a-fA-F]{7,40})[[:space:]]*$#\1#p' | tr 'A-F' 'a-f')
          if [ -z "$named" ]; then
            reply "Usage: \`/reviewed <sha>\` with the head commit you reviewed (at least 7 hex characters)."
            exit 0
          fi
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          case "$head" in
            "$named"*) ;;
            *)
              reply "Not recorded: \`$named\` is not the head of this PR (\`${head:0:7}\`). Review the newer commits, then \`/reviewed ${head:0:7}\`."
              exit 0
              ;;
          esac
          gh api "repos/$REPO/statuses/$head" > /dev/null \
            -f state=success -f context=human-review \
            -f description="Reviewed by @$AUTHOR" -f target_url="$RUN_URL"
          reply "Recorded @$AUTHOR's review of \`${head:0:7}\` (\`human-review\` status). Any new commit needs a new review."

  carry-over:
    name: Carry the review over Mergify's base update
    if: github.event_name == 'pull_request_target' && github.event.sender.login == 'mergify[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: human-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      statuses: write
      contents: read
    steps:
      - name: Re-post the status if the new head only adds base commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reviewed=$(gh api "repos/$REPO/commits/$BEFORE/statuses" \
            --jq '[.[] | select(.context == "human-review")][0].state // ""')
          if [ "$reviewed" != "success" ]; then
            echo "Previous head $BEFORE carried no approval; nothing to carry over."
            exit 0
          fi
          parents=$(gh api "repos/$REPO/commits/$AFTER" --jq '[.parents[].sha] | join(" ")')
          read -r first second extra <<< "$parents"
          if [ "$first" != "$BEFORE" ] || [ -z "$second" ] || [ -n "$extra" ]; then
            echo "New head is not a two-parent merge onto the approved head ($parents); not carried over."
            exit 0
          fi
          # `second` must already be on the base branch: base is identical to or
          # ahead of it.
          rel=$(gh api "repos/$REPO/compare/$second...$BASE" --jq .status)
          if [ "$rel" != "identical" ] && [ "$rel" != "ahead" ]; then
            echo "Merged-in parent $second is not on $BASE ($rel); not carried over."
            exit 0
          fi
          gh api "repos/$REPO/statuses/$AFTER" > /dev/null \
            -f state=success -f context=human-review \
            -f description="Carried over Mergify's base update of ${BEFORE:0:7}" -f target_url="$RUN_URL"
          echo "Approval carried from $BEFORE to $AFTER."
