name: Workflow Lint

# CI plan, phase 7. The workflows and the Claude hooks are the guardrails;
# nothing checked them. This job does, on every PR that touches them:
#   - actionlint: syntax, expressions, runner labels, and shellcheck on every
#     `run:` block (shellcheck is preinstalled on ubuntu-latest);
#   - zizmor: Actions security audits (template injection, dangerous triggers,
#     over-broad permissions, cache poisoning...). It passes clean today; the
#     few accepted findings are `# zizmor: ignore[rule]` comments, with the
#     reason, at the end of the flagged line itself (zizmor only honours them
#     there), in the workflow (held for review like any workflow change).
#     --offline: the audits that query the GitHub API are a follow-up, once
#     one run shows their output;
#   - the guard hooks' own tests (.claude/hooks/tests), which ran nowhere.
#
# Always triggers (a required check that never reports blocks a PR forever);
# the lint job is skipped when no workflow or hook changed.

on:
  pull_request:
    branches: [polity, develop]
  push:
    branches: [polity, develop]

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect workflow changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            lint:
              - '.github/workflows/**'
              - '.claude/hooks/**'

  lint:
    needs: changes
    # A detector that did not succeed (failed, or its job cancelled) runs the
    # lint anyway: skipped would pass the required check without linting
    # anything. !cancelled() rather than always(): a superseded run still stops.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.lint == 'true') }}
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install the linters (pinned)
        run: python -m pip install actionlint-py==1.7.12.25 zizmor==1.30.1
      - name: actionlint (with shellcheck)
        run: actionlint -color
      - name: zizmor (offline, medium and up)
        if: always()
        run: zizmor --offline --min-severity medium .github/workflows
      - name: Guard hook tests
        if: always()
        run: python3 -m unittest discover -s .claude/hooks/tests -v
