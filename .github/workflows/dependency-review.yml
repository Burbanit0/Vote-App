name: Dependency Review

# Complements Dependabot (which scans dependencies already in the tree):
# this scans the DIFF of a PR and fails if it introduces a newly vulnerable
# or license-incompatible package — the thing Dependabot can't catch because
# it only ever proposes updates to what's already there.

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Dependency Review
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
        with:
          fail-on-severity: high
