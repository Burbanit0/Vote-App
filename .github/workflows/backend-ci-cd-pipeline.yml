name: Backend CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'fast_api_voter/**'
      # …and the pipeline definition itself: editing it must run it.
      - '.github/workflows/backend-ci-cd-pipeline.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'fast_api_voter/**'
      # …and the pipeline definition itself: editing it must run it.
      - '.github/workflows/backend-ci-cd-pipeline.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Prefixed to disambiguate from Frontend CI's identically-named job: GitHub
    # matches required status checks on this literal name, and two check-runs
    # sharing one name are indistinguishable to branch protection.
    name: "Backend: Tests + Coverage + Security"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: fast_api_voter/requirements.txt

      - name: Install production + dev dependencies
        run: |
          pip install -r fast_api_voter/requirements.txt
          pip install -r fast_api_voter/requirements-dev.txt

      # ── Linting ────────────────────────────────────────────────────────────
      # Blocking: .flake8 now selects only E9 + F (syntax + pyflakes real bugs),
      # so this gates on genuine issues, not the cosmetic column-alignment style.
      - name: Flake8 (E9 + pyflakes — blocking)
        run: flake8 --config=fast_api_voter/.flake8 fast_api_voter

      # ── Security ───────────────────────────────────────────────────────────
      - name: Bandit (Python SAST — gating)
        run: |
          bandit -r fast_api_voter/api \
            -ll \
            --skip B104,B311
        # -ll = medium+ severity. Now GATING (the backend is bandit-clean: the only
        # B324 md5 findings were switched to sha256). B104 (bind-all) / B311 (non-crypto
        # random) stay skipped — both are intentional in this study app.

      # Blocking, matching `npm audit --audit-level=high` on the frontend side —
      # was informational-only before. Precheck 2026-08-27: zero open Dependabot
      # pip-ecosystem alerts touch a package listed in requirements.txt (the only
      # 6 open ones are all aiohttp, pinned to the patched 3.14.3 in
      # requirements-dev.txt, which this step doesn't scan).
      - name: pip-audit (dependency CVEs)
        run: pip-audit --requirement fast_api_voter/requirements.txt

      # ── Type checking ─────────────────────────────────────────────────────
      - name: Mypy (strict type checking on api/)
        run: |
          cd fast_api_voter
          python -m mypy api/ --config-file mypy.ini

      # ── Tests + Coverage ───────────────────────────────────────────────────
      # -n auto (pytest-xdist): measured 1508 passed/41 skipped, 89.63%
      # coverage, identical to sequential — ~14min -> ~8min on this same
      # 4-vCPU runner class. Coverage combines fine across workers (pytest-cov
      # handles this automatically); test_sockets.py already uses a random
      # free port per test (_free_port()), so no cross-worker port collision.
      - name: Tests with coverage (85% minimum)
        env:
          FLASK_ENV: testing
        run: |
          cd fast_api_voter
          python -m pytest api/tests -v -n auto \
            --cov=api \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90
