name: Backend CI

# No top-level `paths:` filter (moved to the `changes` job below, on purpose):
# this workflow is a required status check, and a required check scoped by
# `paths:` at trigger level never even creates a check run on a PR that
# doesn't touch those paths — which blocks that PR's merge FOREVER (a required
# check that never reports can't be satisfied). That's exactly what happened
# to PR #205 (a docs/CI-only change) before this workflow was added to
# required checks. The workflow now always triggers; the real job is skipped
# instead, which GitHub treats as a passing required check.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'fast_api_voter/**'
              - '.github/workflows/backend-ci-cd-pipeline.yml'

  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Prefixed to disambiguate from Frontend CI's identically-named job: GitHub
    # matches required status checks on this literal name, and two check-runs
    # sharing one name are indistinguishable to branch protection.
    name: "Backend: Tests + Coverage + Security"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # fetch-depth: 0 (full history) — needed by the diff-cover step below,
      # which diffs against the PR's base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      # diff-cover compares HEAD against this local branch (see below); a
      # plain `origin/<base_ref>` isn't guaranteed to exist as a
      # remote-tracking ref after actions/checkout's own fetch.
      - name: Fetch base branch (for diff-cover)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF:$BASE_REF"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # Replaces pip (Lot 1, PLAN_SOLIDITE_TECHNIQUE.md): resolves/installs
      # deps far faster than pip, with its own dependency-glob cache (no
      # separate actions/cache setup needed). No `python-version` input here —
      # `uv pip install --system` targets actions/setup-python's interpreter
      # above; a uv-managed one (via setup-uv's own python-version) is
      # rejected by `--system` ("No system Python installation found").
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: 'fast_api_voter/requirements*.txt'

      - name: Install production + dev dependencies
        run: |
          uv pip install --system -r fast_api_voter/requirements.txt
          uv pip install --system -r fast_api_voter/requirements-dev.txt

      # ── Linting ────────────────────────────────────────────────────────────
      # Blocking. Replaces flake8 (Lot 1, PLAN_SOLIDITE_TECHNIQUE.md) — rule
      # selection (pyflakes real bugs only, not the cosmetic column-alignment
      # style) lives in fast_api_voter/pyproject.toml, auto-discovered.
      - name: Ruff (pyflakes — blocking)
        run: ruff check fast_api_voter

      # Makes the voter-api skill's documented routes -> domain -> engine
      # layering blocking instead of just written down (Lot 2,
      # PLAN_SOLIDITE_TECHNIQUE.md) — see pyproject.toml's [tool.importlinter]
      # for exactly what's enforced and what's deliberately left out.
      - name: Import layering — routes -> domain -> engine (blocking)
        run: |
          cd fast_api_voter
          lint-imports

      # ── Security ───────────────────────────────────────────────────────────
      - name: Bandit (Python SAST — gating)
        run: |
          bandit -r fast_api_voter/api \
            -ll \
            --skip B104,B311
        # -ll = medium+ severity. Now GATING (the backend is bandit-clean: the only
        # B324 md5 findings were switched to sha256). B104 (bind-all) / B311 (non-crypto
        # random) stay skipped — both are intentional in this study app.

      - name: pip-audit (dependency CVEs)
        run: pip-audit --requirement fast_api_voter/requirements.txt

      - name: License compliance — production dependencies (gating)
        run: bash fast_api_voter/scripts/check_license_compliance.sh
        # Isolated venv, requirements.txt only — dev tooling (pylint/refurb,
        # semgrep) pulls in GPL/LGPL packages never distributed with the app;
        # checking the shared dev+prod venv here would false-positive on
        # those every run. See PLAN_SOLIDITE_TECHNIQUE.md §6.7.

      # ── Type checking ─────────────────────────────────────────────────────
      - name: Mypy (strict type checking on api/)
        run: |
          cd fast_api_voter
          python -m mypy api/ --config-file mypy.ini

      # ── Tests + Coverage ───────────────────────────────────────────────────
      # -n auto (pytest-xdist): measured 1508 passed/41 skipped, 89.63%
      # coverage, identical to sequential — ~14min -> ~8min on this same
      # 4-vCPU runner class. Coverage combines fine across workers (pytest-cov
      # handles this automatically); test_sockets.py already uses a random
      # free port per test (_free_port()), so no cross-worker port collision.
      - name: Tests with coverage (85% minimum)
        env:
          FLASK_ENV: testing
        run: |
          cd fast_api_voter
          python -m pytest api/tests -v -n auto \
            --cov=api \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90

      # Codecov (Lot 1, PLAN_SOLIDITE_TECHNIQUE.md): PR coverage comment +
      # trend over time. Purely informational — see codecov.yml
      # (informational: true on both statuses); diff-cover below is the
      # actual enforced gate. Runs on push too (not just pull_request), so
      # the develop-branch trend graph stays populated.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: fast_api_voter/coverage.xml
          flags: backend

      # diff-cover (Lot 1, PLAN_SOLIDITE_TECHNIQUE.md): 100% coverage on lines
      # *changed* by this PR — far more mordant than the 90% global floor
      # above, which a large already-tested codebase dilutes. Cobertura XML
      # (coverage.xml) carries its own <source> root, so no path massaging is
      # needed here (unlike the frontend's lcov.info — see
      # frontend-ci-cd-pipeline.yml).
      - name: diff-cover — 100% coverage on changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          diff-cover fast_api_voter/coverage.xml \
            --compare-branch="$BASE_REF" \
            --fail-under=100
