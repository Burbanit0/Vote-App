name: Backend CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'flask_voter_app/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'flask_voter_app/**'

jobs:
  test:
    name: Tests + Coverage + Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: flask_voter_app/requirements.txt

      - name: Install production + dev dependencies
        run: |
          pip install -r flask_voter_app/requirements.txt
          pip install -r flask_voter_app/requirements-dev.txt

      # ── Linting ────────────────────────────────────────────────────────────
      # Blocking: .flake8 now selects only E9 + F (syntax + pyflakes real bugs),
      # so this gates on genuine issues, not the cosmetic column-alignment style.
      - name: Flake8 (E9 + pyflakes — blocking)
        run: flake8 --config=flask_voter_app/.flake8 flask_voter_app

      # ── Security ───────────────────────────────────────────────────────────
      - name: Bandit (Python SAST — gating)
        run: |
          bandit -r flask_voter_app/api \
            -ll \
            --skip B104,B311
        # -ll = medium+ severity. Now GATING (the backend is bandit-clean: the only
        # B324 md5 findings were switched to sha256). B104 (bind-all) / B311 (non-crypto
        # random) stay skipped — both are intentional in this study app.

      - name: pip-audit (dependency CVEs)
        run: pip-audit --requirement flask_voter_app/requirements.txt
        continue-on-error: true   # informational for now

      # ── Type checking ─────────────────────────────────────────────────────
      - name: Mypy (strict type checking on api/)
        run: |
          cd flask_voter_app
          python -m mypy api/ --config-file mypy.ini

      # ── Tests + Coverage ───────────────────────────────────────────────────
      - name: Tests with coverage (30% minimum)
        env:
          FLASK_ENV: testing
          JWT_SECRET_KEY: ci-test-secret
        run: |
          cd flask_voter_app
          python -m pytest api/tests -v \
            --cov=api \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=30
