name: Backend CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'flask_voter_app/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'flask_voter_app/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: flask_voter_app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r flask_voter_app/requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Lint
        run: flake8 --config=flask_voter_app/.flake8 flask_voter_app
        continue-on-error: true   # lint warnings don't block tests

      - name: Run tests
        env:
          FLASK_ENV: testing           # uses SQLite in-memory — no Postgres needed
          JWT_SECRET_KEY: test-secret-key
        run: |
          cd flask_voter_app
          python -m pytest tests -v --cov=app --cov-report=term-missing
