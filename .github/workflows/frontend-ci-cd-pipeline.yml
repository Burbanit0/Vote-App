name: Frontend CI

# No top-level `paths:` filter (moved to the `changes` job below, on purpose):
# this workflow is a required status check, and a required check scoped by
# `paths:` at trigger level never even creates a check run on a PR that
# doesn't touch those paths — which blocks that PR's merge FOREVER (a required
# check that never reports can't be satisfied). That's exactly what happened
# to PR #205 (a docs/CI-only change) before this workflow was added to
# required checks. The workflow now always triggers; the real job is skipped
# instead, which GitHub treats as a passing required check.
on:
  push:
    branches: [develop, main, polity, polity-ui]
  pull_request:
    branches: [develop, main, polity, polity-ui]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'voter-app/**'
              - '.github/workflows/frontend-ci-cd-pipeline.yml'
              # Read by the npm audit gate (scripts/check-npm-audit.mjs).
              - '.github/npm-audit-allowlist.json'

  test:
    needs: changes
    # A detector that did not succeed (failed, or its job cancelled) runs this
    # anyway: skipped would pass the required check without testing anything.
    # !cancelled() rather than always(): a superseded run still stops.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    # Prefixed to disambiguate from Backend CI's identically-named job: GitHub
    # matches required status checks on this literal name, and two check-runs
    # sharing one name are indistinguishable to branch protection.
    name: "Frontend: Tests + Coverage + Security"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # fetch-depth: 0 (full history) — needed by the diff-cover step below,
      # which diffs against the PR's base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # diff-cover compares HEAD against this local branch (see below); a
      # plain `origin/<base_ref>` isn't guaranteed to exist as a
      # remote-tracking ref after actions/checkout's own fetch.
      - name: Fetch base branch (for diff-cover)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF:$BASE_REF"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: voter-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./voter-app

      # Blocking: eslint now reports 0 errors (prettier-formatted, dead imports
      # removed, no-undef/no-unused-vars deferred to TS). Pre-existing unused-var
      # and a11y debt is surfaced as non-failing warnings (burn-down backlog).
      - name: Lint (blocking — 0 errors)
        run: npm run lint
        working-directory: ./voter-app

      # Lot 14 (PLAN_SOLIDITE_TECHNIQUE.md): package.json's `typeCoverage.atLeast`
      # is the ratchet -- type-coverage reads it itself (no CLI flag needed) and
      # fails below it. Was informational-only (§6.4) until the 280 real `any`s
      # measured there were actually reduced (238 by the time this gate was
      # added); gating an unreduced baseline would have meant enforcing debt, not
      # preventing it. A genuine future improvement is locked in with
      # `npx type-coverage --update-if-higher`, committing the new package.json
      # value -- never hand-edit the number down to make a red run green.
      - name: Type coverage — no regression (blocking)
        run: npm run type-coverage
        working-directory: ./voter-app

      # Frontend equivalent of the backend's import-linter layering contract
      # (Lot 2, PLAN_SOLIDITE_TECHNIQUE.md) — see .dependency-cruiser.json for
      # exactly what's enforced (src/lib must stay framework-agnostic, per
      # CLAUDE.md's Playground architecture section) and why type-only
      # imports are exempt.
      - name: Architecture boundaries (dependency-cruiser — blocking)
        run: npm run depcruise
        working-directory: ./voter-app

      # Full dependency tree, high/critical, minus .github/npm-audit-allowlist.json
      # (dated, reviewed exceptions). Plain `npm audit --audit-level=high` made
      # this required check fail on advisory-database updates with no way out
      # but weakening it (polity red from 2026-09-30, brace-expansion via
      # eslint); `--omit=dev` would have been wrong too, since workbox-* is a
      # devDependency that ships in the bundle and the service worker. See
      # scripts/check-npm-audit.mjs's header.
      - name: Security — npm audit (high CVEs block, dated allowlist)
        run: npm run audit:gate
        working-directory: ./voter-app

      # The gate above decides a required check, so its own rules (expiry,
      # horizon, install-path coverage, failed-audit handling) are tested too.
      - name: CI script self-tests (node --test)
        run: npm run test:scripts
        working-directory: ./voter-app

      - name: License compliance — production dependencies (gating)
        # --production scopes to what's actually shipped, excluding
        # devDependencies (eslint plugins, type-coverage, etc. never reach a
        # user); --excludePackages drops voter-app's own package.json entry,
        # which the tool otherwise reports as "UNLICENSED" despite its real
        # "license": "MIT" field. See PLAN_SOLIDITE_TECHNIQUE.md §6.7.
        run: |
          SELF="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          npx license-checker-rseidelsohn --production \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;BlueOak-1.0.0;MPL-2.0;CC0-1.0;MIT-0;Python-2.0;Unlicense;0BSD;(MIT OR CC0-1.0);MIT AND ISC" \
            --excludePackages "$SELF"
        working-directory: ./voter-app

      - name: Tests with coverage
        # Vitest (post Jest→Vitest migration): coverage reporters are configured
        # in vitest.config.ts (text, lcov, html). test:coverage = `vitest run --coverage`.
        run: npm run test:coverage
        working-directory: ./voter-app
        env:
          CI: 'true'

      # Codecov (Lot 1, PLAN_SOLIDITE_TECHNIQUE.md): PR coverage comment +
      # trend over time. Purely informational — see codecov.yml
      # (informational: true on both statuses); diff-cover below is the
      # actual enforced gate. Runs on push too (not just pull_request), so
      # the develop-branch trend graph stays populated. Raw lcov.info (not
      # the diff-cover step's voter-app/-prefixed copy) — Codecov resolves
      # paths against its own uploaded-from directory, unlike diff-cover's
      # git-diff-path matching.
      # Handed to the `codecov` job below, which uploads it with a short-lived
      # OIDC token: this job runs the PR's code, so it holds neither the
      # upload token nor id-token: write.
      - name: Keep the coverage report for the Codecov upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-frontend
          path: voter-app/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      # diff-cover (Lot 1, PLAN_SOLIDITE_TECHNIQUE.md): 100% coverage on lines
      # *changed* by this PR — far more mordant than vitest.config.ts's global
      # thresholds, which a large already-tested codebase dilutes.
      - name: diff-cover — 100% coverage on changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # vitest writes lcov.info with SF: paths relative to voter-app/ (its
          # own cwd), but `git diff` (and diff-cover's lcov reader) expects
          # paths relative to the repo root — prefix them so the two line up.
          sed 's|^SF:|SF:voter-app/|' voter-app/coverage/lcov.info > voter-app/coverage/lcov-diffcover.info
          # pipx ships on the ubuntu runner, so no Python setup step just for this.
          # diff-cover and its dependencies come from the backend's dev lockfile,
          # the one place the version is pinned (Dependabot keeps it current).
          pipx run --pip-args='-c fast_api_voter/requirements-dev.lock.txt' --spec diff-cover \
            diff-cover voter-app/coverage/lcov-diffcover.info \
            --compare-branch="$BASE_REF" \
            --fail-under=100

      - name: Build
        run: npm run build
        working-directory: ./voter-app

  # Uploads the coverage report kept by `test`. It runs no repository code
  # (checkout only gives Codecov the file list to map paths), so it is the
  # one job allowed to mint an OIDC token. Informational, not required: see
  # codecov.yml.
  codecov:
    name: Upload frontend coverage to Codecov
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload, instead of a stored token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-frontend
          path: voter-app/coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: voter-app/coverage/lcov.info
          flags: frontend
