name: Frontend CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'voter-app/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'voter-app/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: voter-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./voter-app

      - name: Lint
        run: npm run lint
        working-directory: ./voter-app
        continue-on-error: true   # lint warnings don't block the build

      - name: Run tests
        run: npm test
        working-directory: ./voter-app
        env:
          CI: 'true'             # disables Jest watch mode as a fallback

      - name: Build
        run: npm run build
        working-directory: ./voter-app
