name: Frontend CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'voter-app/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'voter-app/**'

jobs:
  test:
    name: Tests + Coverage + Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: voter-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./voter-app

      # Blocking: eslint now reports 0 errors (prettier-formatted, dead imports
      # removed, no-undef/no-unused-vars deferred to TS). Pre-existing unused-var
      # and a11y debt is surfaced as non-failing warnings (burn-down backlog).
      - name: Lint (blocking — 0 errors)
        run: npm run lint
        working-directory: ./voter-app

      - name: Security — npm audit (high CVEs block)
        run: npm audit --audit-level=high
        working-directory: ./voter-app

      - name: Tests with coverage
        # Vitest (post Jest→Vitest migration): coverage reporters are configured
        # in vitest.config.ts (text, lcov, html). test:coverage = `vitest run --coverage`.
        run: npm run test:coverage
        working-directory: ./voter-app
        env:
          CI: 'true'

      - name: Build
        run: npm run build
        working-directory: ./voter-app
