name: DAST — ZAP Baseline

# Lot 9, PLAN_SOLIDITE_TECHNIQUE.md ("DAST — ZAP baseline"): every scanner in
# audit.yml (Semgrep, CodeQL, Trivy, Gitleaks) only ever reads source — none of
# them observes the app actually running, so a header/config issue that only
# exists in the served response (a missing X-Content-Type-Options, a cookie
# without SameSite, …) is invisible to all of them. This workflow runs OWASP
# ZAP's baseline scan against the real running app instead.
#
# "Baseline" is deliberately the ZAP mode used here, not "full scan" or
# "API scan" — verified by reading zap-baseline.py's own --help and the
# zaproxy.org docs before wiring anything: baseline only spiders + runs
# PASSIVE scan rules (no attack payloads sent, ever). An OpenAPI-driven scan
# (`zap-api-scan.py` / the `zaproxy/action-api-scan` action) was considered —
# openapi.gen.json already exists and is exactly what that mode wants — but it
# actively attacks every documented parameter (SQLi/XSS payloads, "attempt
# exploitation" per ZAP's own docs), which is the aggressive mode this plan
# item explicitly does not ask for. See docs/exploration/EXP-009 for the full
# investigation, including a client-spider (`-j`) run that hung indefinitely
# (~59 min, killed) — dropped in favour of the traditional spider only, which
# still discovers every real static asset referenced from the page's raw HTML
# (<script src>, <link href>, sitemap.xml, robots.txt, PWA icons, …) without
# needing to execute JS.
#
# NON-GATING (`fail_action: false` below), same posture as the image-scan job
# in audit.yml: a passive scan against a real server takes low-single-digit
# minutes end to end (measured locally: ~30s for the frontend, ~30s for the
# backend, once both servers are already up) — cheap enough for every
# push-to-develop, but a live-app dependency two other scanners don't have is
# a real new failure mode (port already bound, server slow to boot, ZAP's own
# container pull) that shouldn't be able to block a PR on day one. Findings
# land as a downloadable report artifact + a step summary, not the Security
# tab: ZAP's official action has no SARIF output today (the community
# converters that exist were not adopted — unverified maintenance, see
# EXP-009) and `allow_issue_writing` is turned off (every other scanner in
# this repo reports via artifact/Security-tab/step-summary, never by filing a
# fresh GitHub issue on its own).
#
# `schedule`/`workflow_dispatch` resolve against the DEFAULT branch — this
# repo's default is already `develop` (unlike the historical main-vs-develop
# lag hit by mutation-testing.yml/schemathesis.yml), but `push: develop` is
# kept anyway so a merged fix is checked the same day, not just at 02:xx UTC.
on:
  push:
    branches: [develop]
    paths:
      - 'voter-app/**'
      - 'fast_api_voter/**'
      - '.github/workflows/dast.yml'
  workflow_dispatch: {}
  schedule:
    - cron: '42 2 * * *' # nightly, 02:42 UTC — off-peak, distinct from every other cron in this repo

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP baseline scan (frontend + backend)
    runs-on: ubuntu-latest
    # Generous margin, same reasoning as schemathesis.yml: measured locally
    # (~30s/scan once servers are up, ~1 min combined build+boot), but never
    # observed on a real GitHub Actions runner — a real hang (see EXP-009's
    # client-spider finding) should fail loudly well before GitHub's 360 min
    # default, not look like "just slow".
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # ── Backend: same startup as e2e.yml's `e2e` job ──────────────────────
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # No `python-version` here — see backend-ci-cd-pipeline.yml's comment on
      # this same pairing (`--system` rejects a uv-managed interpreter).
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: 'fast_api_voter/requirements*.txt'

      - name: Install Python dependencies
        run: uv pip install --system -r fast_api_voter/requirements.txt

      - name: Start FastAPI backend (testing mode)
        run: |
          cd fast_api_voter
          FLASK_ENV=testing \
          uvicorn api.main:app --host 0.0.0.0 --port 4434 &
          python - <<'EOF'
          import urllib.request, time, sys
          for _ in range(30):
              try:
                  urllib.request.urlopen('http://localhost:4434/api/v2/health')
                  print('Backend is ready')
                  sys.exit(0)
              except Exception:
                  time.sleep(1)
          print('Backend did not start in time', file=sys.stderr)
          sys.exit(1)
          EOF

      # ── Frontend: real production build + preview, same command
      # playwright.visual.config.ts uses to serve the visual-regression job —
      # the point of this scan is what a real deployment actually sends, not
      # what the unminified dev server sends. ────────────────────────────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: voter-app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./voter-app

      - name: Build frontend
        run: npm run build
        working-directory: ./voter-app

      - name: Start frontend (production preview)
        run: |
          cd voter-app
          npx vite preview --host 0.0.0.0 --port 3000 --strictPort &
          python - <<'EOF'
          import urllib.request, time, sys
          for _ in range(30):
              try:
                  urllib.request.urlopen('http://localhost:3000/')
                  print('Frontend is ready')
                  sys.exit(0)
              except Exception:
                  time.sleep(1)
          print('Frontend did not start in time', file=sys.stderr)
          sys.exit(1)
          EOF

      # ── ZAP baseline scans ─────────────────────────────────────────────────
      # `-j`/client-spider deliberately omitted — see the workflow header
      # comment and EXP-009 (it hung indefinitely against this SPA in testing).
      # `-m 2`: 2 minutes is already generous — the traditional spider on a
      # small static asset set + a 7-URL Swagger UI page finishes in seconds,
      # confirmed locally (~30s wall each, including ZAP's own JVM startup).
      - name: ZAP baseline — frontend
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:3000/'
          cmd_options: '-m 2'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-frontend-report

      # The action always writes report_json.json/report_md.md/report_html.html
      # to $GITHUB_WORKSPACE (repo root) under those fixed names — running it a
      # second time below would silently overwrite this scan's output before
      # it's summarised, so snapshot it now.
      - name: Snapshot frontend report
        if: always()
        run: mv report_json.json zap-frontend-report_json.json 2>/dev/null || true

      - name: ZAP baseline — backend (Swagger UI entry point)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:4434/api/v2/docs'
          cmd_options: '-m 2'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-backend-report

      - name: Summarise findings
        if: always()
        run: |
          {
            echo "### ZAP baseline — findings (informational, not gating; see docs/exploration/EXP-009)"
            echo
            echo "#### Frontend (http://localhost:3000/)"
            echo '```'
            jq -r '.site[]?.alerts[]? | "\(.riskdesc) — \(.name) (\(.count)x)"' zap-frontend-report_json.json 2>/dev/null || echo "(no alerts / report missing)"
            echo '```'
            echo "#### Backend (http://localhost:4434/api/v2/docs)"
            echo '```'
            jq -r '.site[]?.alerts[]? | "\(.riskdesc) — \(.name) (\(.count)x)"' report_json.json 2>/dev/null || echo "(no alerts / report missing)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
