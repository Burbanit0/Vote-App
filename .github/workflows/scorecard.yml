name: OpenSSF Scorecard

# Automated supply-chain security posture score (branch protection, pinned
# actions, SAST coverage, etc.) — non-gating, informational, results land in
# the Security tab like the other scanners in audit.yml. Public-repo mode
# (same as audit.yml): SARIF upload is free and results can be published to
# the public Scorecard API for a badge.

on:
  branch_protection_rule: {}
  schedule:
    - cron: "30 7 * * 2" # Tuesday 07:30 UTC — offset from audit.yml (Mon 06:00) and mutation-testing.yml (Mon 04:17)
  push:
    branches: [develop]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to the Security tab
      id-token: write        # publish results to the public Scorecard API
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7

      - uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3 (matches audit.yml's pin)
        with:
          sarif_file: results.sarif
