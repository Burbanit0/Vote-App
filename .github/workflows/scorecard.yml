name: OpenSSF Scorecard

# Automated supply-chain security posture score (branch protection, pinned
# actions, SAST coverage, etc.) — non-gating, informational, results land in
# the Security tab like the other scanners in audit.yml. Public-repo mode
# (same as audit.yml): SARIF upload is free and results can be published to
# the public Scorecard API for a badge.

on:
  branch_protection_rule: {}
  schedule:
    - cron: "30 7 * * 2" # Tuesday 07:30 UTC — offset from audit.yml (Mon 06:00) and mutation-testing.yml (Mon 04:17)
  push:
    branches: [develop]
  workflow_dispatch: {}

concurrency:
  # The weekly cron fires on refs/heads/develop: on its own group, a develop
  # push can no longer cancel it (the CI health watchdog judges this workflow).
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

permissions: {} # the one job grants what it needs

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload SARIF to the Security tab
      id-token: write        # publish results to the public Scorecard API
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3 (matches audit.yml's pin)
        with:
          sarif_file: results.sarif
