name: Generated Artifacts Contract

# Blocking: every generated-and-committed artifact must match what regenerates
# it. Unlike the informational tools in audit.yml's code-quality job, these gate
# immediately — there's no backlog to work down, it's a binary check.
#
#  1. API contract — fast_api_voter/openapi.gen.json (dumped from the live
#     FastAPI app) and voter-app/src/api/types.gen.ts (generated from that JSON
#     via openapi-typescript). See scripts/check_openapi_drift.sh.
#  2. Engine parity fixture — voter-app/src/lib/__fixtures__/engineParity.json,
#     the golden winners the client engine is asserted against. Nothing enforced
#     this before: a backend rule could change while the fixture kept the old
#     winners, leaving the parity test green against a frozen snapshot while the
#     two engines diverged. See scripts/check_engine_parity_drift.sh.
#  3. Generated doc blocks — cog blocks in docs that render facts owned by code
#     (polity's model profiles, the journal event registry; and, from
#     scripts/ci_facts.py, CONTRIBUTING's and the voter-ci skill's workflow and
#     required-check counts, plus CONTRIBUTING's one-row-per-workflow table, so
#     adding or removing a workflow or a required check is checked here). A
#     change that leaves the doc behind, or a hand edit of generated text, fails
#     here. See scripts/check_generated_docs.sh.

# No top-level `paths:` filter (moved to the `changes` job below, on purpose):
# this workflow is a required status check, and a required check scoped by
# `paths:` at trigger level never even creates a check run on a PR that
# doesn't touch those paths — which blocks that PR's merge FOREVER (a required
# check that never reports can't be satisfied). That's exactly what happened
# to PR #205 (a docs/CI-only change) before this workflow was added to
# required checks. The workflow now always triggers; the real job is skipped
# instead, which GitHub treats as a passing required check.
on:
  push:
    branches: [main, develop, polity, polity-ui]
  pull_request:
    branches: [main, develop, polity, polity-ui]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect generated-artifact-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - "fast_api_voter/api/**"
              - "fast_api_voter/scripts/gen_openapi.py"
              - "fast_api_voter/scripts/gen_engine_parity.py"
              - "fast_api_voter/openapi.gen.json"
              # A dependency bump can change the generated schema without
              # touching api/** — confirmed live: fastapi 0.121.2 -> 0.141.1
              # (#253) changed Pydantic's ValidationError shape (added
              # ctx/input) and went uncaught on develop until this filter
              # started watching this workflow file's own edits instead.
              - "fast_api_voter/requirements.txt"
              - "fast_api_voter/requirements.lock.txt"
              - "voter-app/src/api/types.gen.ts"
              - "voter-app/src/lib/__fixtures__/**"
              - "voter-app/package.json"
              - "voter-app/package-lock.json"
              - ".github/workflows/openapi-contract.yml"
              - "scripts/check_*_drift.sh"
              - "scripts/check_generated_docs.sh"
              - "docs/plan/polity/polity-llm-reference.md"
            # Only the doc blocks can move: the job runs, but skips the npm
            # install and the contract and parity checks.
            # The CI counts in CONTRIBUTING and the voter-ci skill
            # (scripts/ci_facts.py): a new workflow or required check moves them.
            docs:
              - "CONTRIBUTING.md"
              - ".claude/skills/voter-ci/SKILL.md"
              - "scripts/ci_facts.py"
              - "scripts/check_ci_health.py"
              - "scripts/setup-branch-protection.sh"
              - ".github/workflows/*.yml"
              - ".github/workflows/*.yaml"

  drift-check:
    needs: changes
    # A detector that did not succeed (failed, or its job cancelled) runs this
    # job and every check in it: skipped would pass the required check without testing anything.
    # !cancelled() rather than always(): a superseded run still stops.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true' || needs.changes.outputs.docs == 'true') }}
    name: Generated artifacts in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Decided once for every step below: the contract and parity checks run
      # when the detector found relevant paths or did not succeed.
      FULL_CHECK: ${{ needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # No `python-version` here — see backend-ci-cd-pipeline.yml's comment on
      # this same pairing (`--system` rejects a uv-managed interpreter).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "fast_api_voter/requirements*.txt"

      - name: Install backend dependencies
        run: uv pip install --system -r fast_api_voter/requirements.lock.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.FULL_CHECK == 'true'
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: voter-app/package-lock.json

      - name: Install frontend dependencies
        if: env.FULL_CHECK == 'true'
        working-directory: voter-app
        run: npm ci --no-audit --no-fund

      - name: API contract drift
        if: env.FULL_CHECK == 'true'
        run: ./scripts/check_openapi_drift.sh

      # Runs even if the contract check failed: two independent artifacts, and
      # seeing both verdicts in one run beats fixing them one push at a time.
      - name: Engine parity fixture drift
        if: always() && env.FULL_CHECK == 'true'
        run: ./scripts/check_engine_parity_drift.sh

      - name: Generated doc blocks in sync
        if: always()
        run: |
          uv pip install --system "$(grep -E '^cogapp==' fast_api_voter/requirements-dev.txt | cut -d' ' -f1)"
          ./scripts/check_generated_docs.sh
