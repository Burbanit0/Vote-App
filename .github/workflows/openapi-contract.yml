name: OpenAPI Contract

# Blocking: fails if fast_api_voter/openapi.gen.json (dumped from the live
# FastAPI app) or voter-app/src/api/types.gen.ts (generated from that JSON
# via openapi-typescript) are out of sync with the code that produces them.
# See scripts/check_openapi_drift.sh and fast_api_voter/scripts/gen_openapi.py
# for the full explanation. Unlike the informational tools in audit.yml's
# code-quality job, this one gates immediately: there's no backlog to work
# down, it's a binary "does the committed file match what regenerates" check.

on:
  push:
    branches: [main, develop]
    paths:
      - "fast_api_voter/api/**"
      - "fast_api_voter/scripts/gen_openapi.py"
      - "fast_api_voter/openapi.gen.json"
      - "voter-app/src/api/types.gen.ts"
      - "voter-app/package.json"
      - "voter-app/package-lock.json"
  pull_request:
    branches: [main, develop]
    paths:
      - "fast_api_voter/api/**"
      - "fast_api_voter/scripts/gen_openapi.py"
      - "fast_api_voter/openapi.gen.json"
      - "voter-app/src/api/types.gen.ts"
      - "voter-app/package.json"
      - "voter-app/package-lock.json"

jobs:
  drift-check:
    name: Generated API contract in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: fast_api_voter/requirements.txt

      - name: Install backend dependencies
        run: pip install -r fast_api_voter/requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: voter-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: voter-app
        run: npm ci --no-audit --no-fund

      - name: Check for drift
        run: ./scripts/check_openapi_drift.sh
