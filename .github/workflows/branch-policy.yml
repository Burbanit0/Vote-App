name: Branch Policy

on:
  pull_request:
    branches: [develop, main, polity, polity-ui]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate branch source and naming
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # .mergify.yml's high-risk review hold lists protected paths as data; a
      # pattern that stops matching any tracked file (a renamed config, a moved
      # oracle) would silently drop that file out of the hold. Runs on every PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Review-hold path patterns still match files
        run: python3 scripts/check_mergify_protected_paths.py
      # The same script classifies every PR for the required `High-risk review
      # gate` (human-review.yml); a classifier bug would release the hold.
      - name: Review-hold classifier tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Check branch naming (PRs to develop)
        # Mergify's own speculative merge-queue checks run against a
        # synthetic `mergify/merge-queue/<hash>` branch it creates itself
        # (see .mergify.yml) — that branch never goes through a real PR's
        # naming convention and shouldn't be held to it.
        if: github.base_ref == 'develop' && !startsWith(github.head_ref, 'mergify/merge-queue/')
        env:
          SOURCE: ${{ github.head_ref }}   # via env (untrusted) — never interpolate into the shell
        run: |
          ALLOWED="^(feature|feat|fix|bugfix|hotfix|refactor|chore|docs|test|ci|perf|dependabot)/.+"

          echo "Source branch : $SOURCE"
          echo "Target branch : develop"

          if [[ ! "$SOURCE" =~ $ALLOWED ]]; then
            echo ""
            echo "❌  La branche '$SOURCE' ne peut pas merger dans develop."
            echo ""
            echo "Préfixes autorisés :"
            echo "  feature/  feat/     → nouvelle fonctionnalité"
            echo "  fix/      bugfix/   → correction de bug"
            echo "  hotfix/             → correction urgente"
            echo "  refactor/ chore/    → refactoring / maintenance"
            echo "  docs/     test/     → documentation / tests"
            echo "  ci/       perf/     → CI/CD / performance"
            echo "  dependabot/         → mises à jour automatiques (Dependabot)"
            echo ""
            echo "Exemple : feature/vote-blanc-toggle"
            exit 1
          fi

          echo "✅  Branche valide pour develop : $SOURCE"

      - name: Check branch naming (PRs to polity)
        if: github.base_ref == 'polity'
        env:
          SOURCE: ${{ github.head_ref }}   # via env (untrusted) — never interpolate into the shell
        run: |
          ALLOWED="^(feature|feat|fix|bugfix|hotfix|refactor|chore|docs|test|ci|perf|dependabot)/.+"

          echo "Source branch : $SOURCE"
          echo "Target branch : polity"

          # polity-ui is the Polity run explorer's integration branch: its features land
          # there first (see the step below), and it merges into polity as one PR.
          if [[ "$SOURCE" != "polity-ui" && ! "$SOURCE" =~ $ALLOWED ]]; then
            echo ""
            echo "❌  La branche '$SOURCE' ne peut pas merger dans polity."
            echo ""
            echo "Préfixes autorisés :"
            echo "  feature/  feat/     → nouvelle fonctionnalité"
            echo "  fix/      bugfix/   → correction de bug"
            echo "  hotfix/             → correction urgente"
            echo "  refactor/ chore/    → refactoring / maintenance"
            echo "  docs/     test/     → documentation / tests"
            echo "  ci/       perf/     → CI/CD / performance"
            echo "  dependabot/         → mises à jour automatiques (Dependabot)"
            echo ""
            echo "Exemple : feat/polity-lot-name"
            exit 1
          fi

          echo "✅  Branche valide pour polity : $SOURCE"

      - name: Check branch naming (PRs to polity-ui)
        if: github.base_ref == 'polity-ui'
        env:
          SOURCE: ${{ github.head_ref }}   # via env (untrusted) — never interpolate into the shell
        run: |
          ALLOWED="^(feat|fix|test|docs|ci|chore|refactor|perf)/(polity-ui-.+|sync-polity-into-polity-ui-.+)$"

          echo "Source branch : $SOURCE"
          echo "Target branch : polity-ui"

          if [[ ! "$SOURCE" =~ $ALLOWED ]]; then
            echo ""
            echo "❌  La branche '$SOURCE' ne peut pas merger dans polity-ui."
            echo ""
            echo "Format attendu : <type>/polity-ui-<fonctionnalité>"
            echo "  types : feat fix test docs ci chore refactor perf"
            echo "  ou    : chore/sync-polity-into-polity-ui-<date> pour resynchroniser"
            echo ""
            echo "Exemple : feat/polity-ui-population-map"
            exit 1
          fi

          echo "✅  Branche valide pour polity-ui : $SOURCE"

      - name: Check source is develop (PRs to main)
        if: github.base_ref == 'main'
        env:
          SOURCE: ${{ github.head_ref }}   # via env (untrusted) — never interpolate into the shell
        run: |
          echo "Source branch : $SOURCE"
          echo "Target branch : main"

          if [ "$SOURCE" != "develop" ]; then
            echo ""
            echo "❌  Seule la branche 'develop' peut merger dans 'main'."
            echo "    Branche reçue : '$SOURCE'"
            echo ""
            echo "Pour déployer une release :"
            echo "  1. Vérifier que develop passe tous les tests"
            echo "  2. Ouvrir une PR develop → main"
            echo "  3. Lancer le workflow '🚀 Release Vote Lab'"
            exit 1
          fi

          echo "✅  Source autorisée pour main : $SOURCE"

      - name: Validate PR title format
        # Same exemption as the naming check above — Mergify's synthetic
        # queue-check PR gets an auto-generated title ("merge queue:
        # checking #N on develop (<sha>)"), not a real contributor's title.
        if: ${{ !startsWith(github.head_ref, 'mergify/merge-queue/') }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Conventional commits format: type(scope): description
          PATTERN="^(feat|fix|docs|chore|refactor|test|ci|perf|style|revert|build|hotfix|security)(\(.+\))?: .{5,}"

          echo "Titre de la PR : $PR_TITLE"

          if [[ ! "$PR_TITLE" =~ $PATTERN ]]; then
            echo ""
            echo "⚠️  Le titre de la PR ne respecte pas le format Conventional Commits."
            echo ""
            echo "Format attendu : type(scope): description (min 5 car.)"
            echo ""
            echo "Types valides :"
            echo "  feat     → nouvelle fonctionnalité"
            echo "  fix      → correction de bug"
            echo "  docs     → documentation"
            echo "  refactor → refactoring sans changement de comportement"
            echo "  test     → ajout/modification de tests"
            echo "  chore    → maintenance, dépendances"
            echo "  ci       → CI/CD"
            echo "  perf     → performance"
            echo "  security → correctif sécurité"
            echo ""
            echo "Exemples :"
            echo "  feat(blank-vote): add competitive rule to scenario builder"
            echo "  fix(navbar): dark mode background not adapting to theme"
            echo "  ci: add pre-commit hooks and coverage thresholds"
            exit 1
          else
            echo "✅  Titre de PR valide."
          fi
