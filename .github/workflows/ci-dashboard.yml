name: CI Dashboard

# Hourly, and after each CI run on polity or develop: collect every completed workflow run (scripts/ci_dashboard/collect.py),
# keep the history on the unprotected `ci-data` branch (runs.jsonl, 30 days),
# and publish ci-dashboard/index.html + summary.json to GitHub Pages.
#
# Schedules only fire from the default branch (develop), so this starts after
# the next polity -> develop sync. The page and the quality baselines it shows
# come from polity, the working branch.
#
# One-time setup by the owner: Settings -> Pages -> Source: "GitHub Actions".
# Pushes made with GITHUB_TOKEN start no workflow, so writing `ci-data` here
# cannot loop.

on: # zizmor: ignore[dangerous-triggers] reads run metadata via the API, never checks out or runs the triggering code
  # GitHub drops schedule events under load (the hourly slot fired once in its
  # first seven hours), so a finished CI run on polity or develop also starts a
  # collection. The names must match each workflow's `name:` exactly: a test
  # (scripts/tests/test_ci_dashboard_collect.py) locks them to the files.
  workflow_run:
    workflows:
      - Backend CI
      - Frontend CI
      - E2E Tests
      - Security Audit
      - Generated Artifacts Contract
      - Mutation Testing
      - Coverage-Guided Fuzzing (atheris)
      - DAST — ZAP Baseline
      - Schemathesis Contract Fuzzing
      - Backend Flaky Test Hunt
      - CI Health Watchdog
      - Workflow Lint
    types: [completed]
    branches: [polity, develop]
  schedule:
    - cron: "17 * * * *"
    - cron: "47 6 * * 1" # Mondays: also rebuild the "CI weekly report" issue
  workflow_dispatch:
    inputs:
      weekly:
        description: Also rebuild the "CI weekly report" issue
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-dashboard
  cancel-in-progress: false

jobs:
  # The collector runs repository code with an API token, so it gets a
  # read-only one and no git credentials. Writing ci-data is a separate job
  # that runs no repository code: it only commits the collector's output.
  collect:
    name: Collect run history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # run listings and job logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: polity
          persist-credentials: false
      - name: Check out the ci-data history (created on first run)
        run: |
          set -euo pipefail
          if git fetch --quiet --depth 1 origin ci-data; then
            git worktree add data FETCH_HEAD
          else
            mkdir data
          fi
      - name: Collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/ci_dashboard/collect.py --data data --days 30 --repo "$REPO"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-data
          path: |
            data/runs.jsonl
            data/summary.json
          if-no-files-found: error
          retention-days: 1
      - name: Assemble the site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp ci-dashboard/index.html data/summary.json "$RUNNER_TEMP/site/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  persist:
    name: Commit the history to ci-data
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the ci-data branch
    steps:
      # Only git runs here; the checkout is for its remote and credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: polity
          sparse-checkout: .github
          persist-credentials: true # pushes ci-data below
      - name: Check out the ci-data branch (created on first run)
        run: |
          set -euo pipefail
          if git fetch --quiet --depth 1 origin ci-data; then
            git worktree add data FETCH_HEAD
            git -C data switch -c ci-data
          else
            git worktree add --orphan -b ci-data data
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-data
          path: data
      - name: Commit and push
        run: |
          set -euo pipefail
          cd data
          git add runs.jsonl summary.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "ci-data: collect $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet origin ci-data

  deploy:
    name: Publish to GitHub Pages
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  weekly-report:
    name: Rebuild the CI weekly report issue
    needs: persist
    if: github.event.schedule == '47 6 * * 1' || inputs.weekly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: polity
          persist-credentials: false
      - name: Write the report and edit the issue in place
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DASHBOARD: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -euo pipefail
          git fetch --quiet --depth 1 origin ci-data
          mkdir -p "$RUNNER_TEMP/data"
          git --work-tree="$RUNNER_TEMP/data" checkout FETCH_HEAD -- runs.jsonl summary.json
          python3 scripts/ci_dashboard/weekly_report.py --data "$RUNNER_TEMP/data" \
            --dashboard "$DASHBOARD" > "$RUNNER_TEMP/report.md"
          gh label create ci-weekly-report --repo "$REPO" --color 5319e7 \
            --description "The CI weekly report (ci-dashboard.yml)" 2>/dev/null || true
          number=$(gh issue list --repo "$REPO" --label ci-weekly-report --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$REPO" --body-file "$RUNNER_TEMP/report.md" > /dev/null
            echo "Updated #$number."
          else
            gh issue create --repo "$REPO" --title "CI weekly report" --label ci-weekly-report \
              --body-file "$RUNNER_TEMP/report.md"
          fi
