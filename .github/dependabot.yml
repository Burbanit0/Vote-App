version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/fast_api_voter"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "all"
    labels:
      - "security"
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "fix"
      include: "scope"
    cooldown:
      default-days: 7
    # 2026-09-08: root cause of the 13-PR merge cascade on 2026-09-06 (see
    # PLAN_SOLIDITE_TECHNIQUE.md, Lot 1) — every patch/minor bump landed as
    # its own PR, and branch protection invalidates every other open PR each
    # time one merges, forcing a repeated update-branch/wait/merge loop.
    # Grouping collapses a week's patch+minor bumps into one PR; majors stay
    # separate since they can need real review.
    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"

    # Transitive pins owned by a parent package: bumping them alone is
    # unresolvable ("No solution found"), and Dependabot reopens the same dead
    # PR every week. Each is capped by something else in this lockfile, so the
    # fix is to bump the parent, not the child.
    ignore:
      # pydantic hard-pins `pydantic-core==<exact>`, and pydantic-core releases
      # ahead of pydantic, so there is routinely a version no stable pydantic
      # accepts. 2.49.0 is one: checked every release on PyPI 2026-09-18, and
      # the only thing pairing with it is pydantic 2.14.0b2 -- a beta, which is
      # a lot of blast radius for a transitive patch bump given pydantic backs
      # every request/response schema here. Re-open when 2.14.0 ships stable.
      - dependency-name: "pydantic-core"
      # radon 6.0.1 declares `mando>=0.6,<0.8`, so the 0.8.x line cannot be
      # installed at all while radon is pinned -- and radon feeds the quality
      # ratchet's complexity count. Moves when radon does.
      - dependency-name: "mando"

  - package-ecosystem: "npm"
    directory: "/voter-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "security"
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "fix"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      # Lockstep families: each package pins its sibling's exact version as a
      # peer, so a major bump of one alone cannot install (ERESOLVE: #633/#634
      # for size-limit, #370 for vitest). patch-and-minor already moves them
      # together, so these groups only take majors (`update-types: major`);
      # without that, Dependabot's specificity rules left @size-limit/* in
      # patch-and-minor and split the pair on every bump.
      size-limit:
        patterns: ["size-limit", "@size-limit/*"]
        update-types: ["major"]
      # Inert while the vitest >=5 ignores below stand; lift both together.
      vitest:
        patterns: ["vitest", "@vitest/*"]
        update-types: ["major"]
      stryker:
        patterns: ["@stryker-mutator/*"]
        update-types: ["major"]
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 2026-09-11, updated 2026-09-14: vitest@5.0.0 and jsdom@30.0.1 both
      # declare `engines.node: >=22.x`, which every CI workflow's Node 20
      # pin used to violate (jsdom 30 crashed every jsdom-pool test under
      # Node 20 with "TypeError: webidl.util.markAsUncloneable is not a
      # function", PR #324's real CI failure). That part is resolved: CI
      # bumped to Node 24 on 2026-09-14 (Node 20 hit its official
      # end-of-life 2026-04-30) -- jsdom's ignore entry is lifted below.
      #
      # vitest / @vitest/coverage-v8 5.x stay ignored for a DIFFERENT,
      # still-live reason, unrelated to Node: they break `tsc --noEmit`
      # because @testing-library/jest-dom@7.0.1 (still its latest release
      # as of 2026-09-14 -- checked `npm view @testing-library/jest-dom
      # versions`, nothing newer) hasn't updated its matcher typings for
      # vitest 5's new `Assertion` generic shape (PR #370). Re-open once
      # jest-dom ships a vitest-5-compatible release; the Node bump alone
      # doesn't fix this one.
      - dependency-name: "vitest"
        versions: [">=5.0.0"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=5.0.0"]
      # eslint@10.x: eslint-plugin-jsx-a11y's latest release (6.10.2, no
      # newer one on npm as of 2026-09-11) still declares
      # `peer eslint@"^3 || ... || ^9"` -- npm ci hard-fails with ERESOLVE
      # (PR #327/#325's real CI failure). Re-open once jsx-a11y ships an
      # eslint-10-compatible release.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      - dependency-name: "@eslint/js"
        versions: [">=10.0.0"]
      # @typescript-eslint/eslint-plugin@8.70.0's peer range is
      # `typescript: ">=4.8.4 <6.1.0"` (checked 2026-09-14) -- a ceiling
      # INSIDE the 6.x line, not at 7.0 (typescript@7.x is a separate,
      # bigger jump anyway: the new Go-based native compiler line,
      # confirmed by its npm package pulling in per-platform
      # `@typescript/typescript-*` binary packages, not a JS rewrite).
      # Bumped to 6.0.3 -- the last release inside typescript-eslint's
      # supported range, and itself a real, tested step: it turns two
      # now-hard-error-deprecated options, baseUrl and downlevelIteration,
      # into full removals in 7.0. `typescript` is pinned to the exact
      # `6.0.3` (no caret) in package.json/overrides specifically so this
      # ignore rule's `>=6.1.0` boundary can't be silently exceeded by a
      # plain `npm install`/`npm update` between now and whenever
      # typescript-eslint's own range moves -- ignoring only `>=7.0.0`
      # would have left 6.1.x-6.x.x, an equally untested range, open.
      # Re-open (and loosen the pin back to a caret range) once
      # typescript-eslint ships a release supporting the new ceiling.
      #
      # Not the only typescript peer in this tree: openapi-typescript also
      # declares a required (non-optional) `typescript: "^5.x"` peer, which
      # 6.0.3 already violates today -- silently fine only because
      # voter-app/package.json's own `overrides` block forces one
      # typescript version across the whole tree regardless of what any
      # package's peer range asks for. Noted here so a future typescript
      # bump doesn't assume this ignore rule was the full compatibility
      # picture.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  # Actions are pinned by commit hash (see any workflow's `# v4`-style
  # comments) — Dependabot proposes hash bumps for these, not just version tags.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"
      - "ci"
    cooldown:
      default-days: 7
    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"

  # Dependabot's docker ecosystem only scans files literally named `Dockerfile`
  # (one entry per directory covers every Dockerfile in it — no glob support) —
  # ci-local/*.Dockerfile are excluded for that reason, not by choice.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"
      - "docker"
    cooldown:
      default-days: 7
    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/fast_api_voter"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"
      - "docker"
      - "backend"
    cooldown:
      default-days: 7
    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"
