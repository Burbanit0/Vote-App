version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/fast_api_voter"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "all"
    labels:
      - "security"
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "fix"
      include: "scope"
    cooldown:
      default-days: 7
    # 2026-09-08: root cause of the 13-PR merge cascade on 2026-09-06 (see
    # PLAN_SOLIDITE_TECHNIQUE.md, Lot 1) — every patch/minor bump landed as
    # its own PR, and branch protection invalidates every other open PR each
    # time one merges, forcing a repeated update-branch/wait/merge loop.
    # Grouping collapses a week's patch+minor bumps into one PR; majors stay
    # separate since they can need real review.
    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # perflint==0.8.1 (its latest release, checked on PyPI) declares
      # `pylint>=3.0.0,<4.0.0` -- pylint 4.x is real, unresolvable
      # incompatibility, not a stale-branch artifact: `uv pip install -r
      # requirements-dev.txt` (this repo's actual CI install step) hard-fails
      # with "No solution found when resolving dependencies" on the combo,
      # confirmed live against PR #371. Re-open the bump once perflint ships
      # a pylint-4-compatible release (check its PyPI page), not before.
      - dependency-name: "pylint"
        versions: [">=4.0.0"]

  - package-ecosystem: "npm"
    directory: "/voter-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "security"
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "fix"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 2026-09-11: vitest@5.0.0 and jsdom@30.0.1 both declare
      # `engines.node: >=22.x` -- every CI workflow here pins Node 20
      # (frontend-ci-cd-pipeline.yml, e2e.yml, audit.yml, etc.). Confirmed
      # locally: jsdom 30 crashes every jsdom-pool test under Node 20
      # ("TypeError: webidl.util.markAsUncloneable is not a function",
      # PR #324's real CI failure); vitest 5 + @vitest/coverage-v8 5
      # install and run under Node 20 despite the EBADENGINE warning, but
      # break `tsc --noEmit` because @testing-library/jest-dom@7.0.1 (its
      # own latest release) hasn't updated its matcher typings for
      # vitest 5's new `Assertion` generic shape (PR #370). Unblocking
      # these needs a deliberate, repo-wide Node 20->22 CI bump, not a
      # routine dependency PR -- ignored until that happens.
      - dependency-name: "vitest"
        versions: [">=5.0.0"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=5.0.0"]
      - dependency-name: "jsdom"
        versions: [">=30.0.0"]
      # eslint@10.x: eslint-plugin-jsx-a11y's latest release (6.10.2, no
      # newer one on npm as of 2026-09-11) still declares
      # `peer eslint@"^3 || ... || ^9"` -- npm ci hard-fails with ERESOLVE
      # (PR #327/#325's real CI failure). Re-open once jsx-a11y ships an
      # eslint-10-compatible release.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      - dependency-name: "@eslint/js"
        versions: [">=10.0.0"]

  # Actions are pinned by commit hash (see any workflow's `# v4`-style
  # comments) — Dependabot proposes hash bumps for these, not just version tags.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"
      - "ci"
    cooldown:
      default-days: 7
    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"

  # Dependabot's docker ecosystem only scans files literally named `Dockerfile`
  # (one entry per directory covers every Dockerfile in it — no glob support) —
  # ci-local/*.Dockerfile are excluded for that reason, not by choice.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"
      - "docker"
    cooldown:
      default-days: 7
    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/fast_api_voter"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"
      - "docker"
      - "backend"
    cooldown:
      default-days: 7
    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/voter-app"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "dependencies"
      - "docker"
      - "frontend"
    cooldown:
      default-days: 7
    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"
