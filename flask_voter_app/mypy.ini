[mypy]
python_version = 3.11
strict = True
plugins = pydantic.mypy
ignore_missing_imports = True
exclude = (tests)

# ── Out-of-scope modules — strict type fixes deferred to a future typing pass ─
# The contract layer (schemas/, routes/, db/models, main) IS strict-clean. The
# modules below are heavy numeric/simulation engine code, dynamic dispatch
# registries, or thin wrappers over loosely-typed third-party libs (fastapi-users,
# python-socketio) — low-ROI to fully annotate, so their errors are ignored to keep
# `mypy api/` green.

# Numeric / simulation engine internals
[mypy-api.domain.election.workers]
ignore_errors = True

[mypy-api.domain.election.workers_playground]
ignore_errors = True

[mypy-api.domain.election.workers_advanced]
ignore_errors = True

[mypy-api.domain.election.workers_behavioral]
ignore_errors = True

[mypy-api.domain.election.workers_dynamics]
ignore_errors = True

[mypy-api.engine.utils.profile_engine]
ignore_errors = True

[mypy-api.domain.theory.workers]
ignore_errors = True

[mypy-api.domain.simulations.base]
ignore_errors = True

[mypy-api.domain.simulations.helpers]
ignore_errors = True

[mypy-api.engine.population_simulation]
ignore_errors = True

[mypy-api.domain.tech]
ignore_errors = True

[mypy-api.engine.utils.cache]
ignore_errors = True

[mypy-api.engine.utils.logger]
ignore_errors = True

# Dynamic dispatch registries (bare Dict handler tables)
[mypy-api.domain.election]
ignore_errors = True

[mypy-api.domain.theory]
ignore_errors = True

# Thin wrappers over loosely-typed third-party libs
[mypy-api.routes.oauth]
ignore_errors = True

[mypy-api.core.users]
ignore_errors = True

[mypy-api.sockets]
ignore_errors = True

# ── Original Flask-era engine utils (never strict-clean) ────────────────────
[mypy-api.engine.utils.simulation_ranked_utils]
ignore_errors = True

[mypy-api.engine.utils.simulation_score_utils]
ignore_errors = True

[mypy-api.engine.utils.simulation_multiwinner_utils]
ignore_errors = True

[mypy-api.engine.utils.arrow_criteria]
ignore_errors = True

[mypy-api.engine.utils.simul]
ignore_errors = True

[mypy-api.engine.utils.demographic_data]
ignore_errors = True

[mypy-api.engine.utils.utils]
ignore_errors = True
