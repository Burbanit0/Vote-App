[mypy]
python_version = 3.11
strict = True
ignore_missing_imports = True
exclude = (migrations|tests)

# ── Out-of-scope modules — type fixes deferred to a future sprint ────────────
# These files are in app/utils/ and app/routes/ and get checked when mypy runs
# on those directories, but they are not part of the current typing sprint.

[mypy-app.utils.simulation_ranked_utils]
ignore_errors = True

[mypy-app.utils.simulation_score_utils]
ignore_errors = True

[mypy-app.utils.simulation_multiwinner_utils]
ignore_errors = True

[mypy-app.utils.arrow_criteria]
ignore_errors = True

[mypy-app.utils.simul]
ignore_errors = True

[mypy-app.utils.demographic_data]
ignore_errors = True

[mypy-app.utils.response_utils]
ignore_errors = True

[mypy-app.utils.decorators]
ignore_errors = True

[mypy-app.utils.auth_utils]
ignore_errors = True

[mypy-app.routes.simulation_base]
ignore_errors = True

[mypy-app.routes.simulation_helpers]
ignore_errors = True

[mypy-app.routes.users]
ignore_errors = True

[mypy-app.routes.scenarios]
ignore_errors = True

[mypy-app.routes.__init__]
ignore_errors = True

[mypy-app.models]
ignore_errors = True

[mypy-app.__init__]
ignore_errors = True

[mypy-app.services.user_service]
ignore_errors = True

[mypy-app.services.*]
ignore_errors = True

[mypy-app.simulation.*]
ignore_errors = True

[mypy-app.constants]
ignore_errors = True

[mypy-app.utils.jwt_utils]
ignore_errors = True

[mypy-app.utils.election_utils]
ignore_errors = True

[mypy-app.utils.utils]
ignore_errors = True

[mypy-app]
ignore_errors = True
