[mypy]
python_version = 3.11
strict = True
plugins = pydantic.mypy
ignore_missing_imports = True
exclude = (tests)

# ── Deferred-typing ignore list (being burned down) ─────────────────────────
# The contract layer, dispatch registries, thin third-party wrappers, and the
# election-worker namespace are all strict-clean now. The modules below are the
# remaining heavy numeric/simulation engine internals — still being annotated.

# Election workers with residual numeric typing
[mypy-api.domain.election.workers_advanced]
ignore_errors = True

[mypy-api.domain.election.workers_behavioral]
ignore_errors = True

[mypy-api.domain.election.workers_playground]
ignore_errors = True

[mypy-api.domain.theory.workers]
ignore_errors = True

# Simulations
[mypy-api.domain.simulations.base]
ignore_errors = True

[mypy-api.domain.simulations.helpers]
ignore_errors = True

# Original Flask-era engine utils
[mypy-api.engine.utils.simulation_ranked_utils]
ignore_errors = True

[mypy-api.engine.utils.simulation_score_utils]
ignore_errors = True

[mypy-api.engine.utils.simulation_multiwinner_utils]
ignore_errors = True

[mypy-api.engine.utils.arrow_criteria]
ignore_errors = True

[mypy-api.engine.utils.simul]
ignore_errors = True

[mypy-api.engine.utils.demographic_data]
ignore_errors = True

[mypy-api.engine.utils.utils]
ignore_errors = True
