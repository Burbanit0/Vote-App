[mypy]
python_version = 3.11
strict = True
plugins = pydantic.mypy
ignore_missing_imports = True
exclude = (tests)

# ── Deferred-typing ignore list (final stretch) ─────────────────────────────
# Remaining heavy numeric engine internals still being annotated.
[mypy-api.engine.utils.simulation_ranked_utils]
