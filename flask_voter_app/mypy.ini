[mypy]
python_version = 3.11
strict = True
ignore_missing_imports = True
exclude = (tests)

# ── Out-of-scope engine modules — type fixes deferred to a future sprint ─────
# These came from the original Flask app's utils (now api/engine/utils/) and were
# never strict-clean. Kept ignored so `mypy api/` stays green until a typing pass.

[mypy-api.engine.utils.simulation_ranked_utils]
ignore_errors = True

[mypy-api.engine.utils.simulation_score_utils]
ignore_errors = True

[mypy-api.engine.utils.simulation_multiwinner_utils]
ignore_errors = True

[mypy-api.engine.utils.arrow_criteria]
ignore_errors = True

[mypy-api.engine.utils.simul]
ignore_errors = True

[mypy-api.engine.utils.demographic_data]
ignore_errors = True

[mypy-api.engine.utils.utils]
ignore_errors = True
