# docker-compose.llm.yml — vLLM inference server (v4 vLLM switch, §15bis.6)
#
# ⚠ UNVERIFIED — never executed. A GPU (RTX 5070 Ti) became available in
# this project's environment on 2026-08-17 and has been used to validate
# Ollama on GPU (llm_batching_determinism_results_gpu.md) -- but no vLLM
# server has ever been stood up on it, so this file remains untested for
# that reason specifically. Every prior LLM finding here (batching
# determinism, structured-output quirks, think=False bugs) was measured
# against Ollama, not vLLM.
# The design doc (§15) names this file; this is its first materialization.
#
# Kept separate from docker-compose.yml (api + redis) so the api+redis stack
# is unaffected on machines without a GPU — this file is opt-in.
#
# Usage:
#   docker compose -f docker-compose.llm.yml up -d
#   # then in polity_config.yaml: llm.provider: vllm, llm.base_url:
#   # "http://localhost:8000/v1" (see that file's own comment block)
#
# Two flags are load-bearing, not cosmetic — see VllmJsonClient's docstring
# (api/domain/polity/llm_client.py) for the full reasoning:
#   --served-model-name qwen3:8b   llm.model's pinning rule (config.py)
#                                   rejects a bare HF repo id like
#                                   "Qwen/Qwen3-8B" (no ':') — this keeps
#                                   llm.model, and every prompt/journal byte
#                                   downstream of it, identical across
#                                   providers.
#   --reasoning-parser qwen3       without it, vLLM's structured-output
#                                   grammar may make `enable_thinking: true`
#                                   a SILENT no-op (residual risk R1) — the
#                                   same failure mode that already produced
#                                   a 100%-reproducible degenerate batch on
#                                   Ollama under decide_campaign_positioning
#                                   (see that function's own docstring).
#
# ⚠ Different weights from the Ollama default, on purpose: Qwen/Qwen3-8B
# in bf16 needs ~16GB for weights ALONE (8B params x 2 bytes) -- on this
# project's 16.3GB card (RTX 5070 Ti) that leaves ~0 headroom for KV
# cache and would almost certainly OOM at launch. Qwen/Qwen3-8B-AWQ
# (4-bit, ~4-5GB weights) is used instead -- see
# plan-vllm-switch-readiness.md for the full VRAM reasoning. This is a
# SECOND variable confounded with the serving-layer switch, not a
# transparent substitution: every committed live results doc
# (ollama_structured_output_results.md, batch_size_boundary_results.md,
# lot6_batch_reliability_results.md, acceptance_v4_results.md) describes
# Ollama running the UN-quantized GGUF qwen3:8b -- none of those numbers,
# nor the token-budget/chunk-size calibrations derived from them
# (_POSITIONING_THINK_TOKEN_ALLOWANCE, _VOTE_CAST_MAX_CHUNK_SIZE,
# _CHAMBER_MAX_CHUNK_SIZE), are assumed to transfer to AWQ without
# re-verification (plan-vllm-switch-readiness.md §3, axis b).
#
# §15's own vigilance note: beyond ~4 concurrent requests per GPU, time-to-
# first-token tends to double. Doesn't bind THIS client, which never issues
# concurrent requests itself (llm_client.py's module docstring) — it's a
# property of the fleet if multiple runs share a GPU, not of a single run.
#
# No redis service here: §4.2's response cache is not implemented (see
# polity_config.yaml's llm.cache_backend comment) and this lot does not
# build it.

services:
  vllm:
    # Pinned 2026-08-29 (plan-vllm-switch-readiness.md): confirmed to exist
    # on Docker Hub directly (not guessed), amd64, pushed 2026-08-26.
    image: vllm/vllm-openai:v0.28.0
    container_name: vllm-polity
    command:
      - "--model"
      - "Qwen/Qwen3-8B-AWQ"         # NOT the base repo -- see the VRAM note
                                    # above. Official Qwen release, not a
                                    # community requant.
      - "--revision"
      - "4da05a8edb55c6046cce958586c33b61da07bb79"  # pinned via the HF API
                                    # directly 2026-08-29 (`sha` field of
                                    # /api/models/Qwen/Qwen3-8B-AWQ), not
                                    # copied from a webpage.
      - "--quantization"
      - "awq_marlin"                # vLLM's AWQ kernel; awq_marlin (not
                                    # plain awq) is the maintained path on
                                    # Ampere+ GPUs including this card
                                    # (Blackwell).
      - "--served-model-name"
      - "qwen3:8b"                 # must match polity_config.yaml's llm.model
                                    # -- deliberately does NOT match the repo
                                    # actually served (Qwen3-8B-AWQ, not the
                                    # base repo): every prompt/journal byte
                                    # downstream stays identical across
                                    # providers. Not a labeling error --
                                    # see plan-vllm-switch-readiness.md §6.
      - "--reasoning-parser"
      - "qwen3"
      - "--max-model-len"
      - "16384"                    # measured live 2026-09-05: 8192 was too small.
                                    # compute_max_tokens(25)=3036 + a real 25x20-dim
                                    # vote prompt (~5157 input tokens) alone already
                                    # exceeded 8192; decide_campaign_positioning's
                                    # output budget alone (_POSITIONING_THINK_TOKEN_
                                    # ALLOWANCE=8000 + compute_max_tokens, up to 9836)
                                    # exceeds it regardless of input. 16384 clears
                                    # both with real headroom.
                                    # ⚠ First tried 24576: worked on one cold start,
                                    # then CUDA-OOM'd on a plain `compose restart`
                                    # (vllm's own free-memory auto-profiling isn't
                                    # stable run to run on this 16GB card -- 5.93 GiB
                                    # KV cache reserved one run, 8.02 GiB the next,
                                    # for the SAME flag -- the second left only 37MiB
                                    # free and died during CUDA-graph/sampler warmup,
                                    # not under load). 16384 + the explicit
                                    # --gpu-memory-utilization below replace that
                                    # auto-profiling with a fixed, reproducible
                                    # budget instead of chasing a larger one. Verify
                                    # with >=3 consecutive clean restarts before
                                    # trusting this, not just one -- that's exactly
                                    # what 24576 lacked when it fooled a first pass.
      - "--gpu-memory-utilization"
      - "0.80"                     # explicit and conservative, not vLLM's own
                                    # auto-tuned default (observed 0.92 -- the value
                                    # that left only 37MiB free above) -- this client
                                    # never issues concurrent requests (see
                                    # VllmJsonClient's docstring), so a modest,
                                    # explicit budget with real margin matters more
                                    # here than maximizing concurrency headroom.
      - "--port"
      - "8000"
      - "--seed"
      - "42"
    ports:
      - "8000:8000"
    ipc: host                      # vLLM's own recommendation, for its shared-memory tensor cache
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s           # model load time, unmeasured here

volumes:
  huggingface_cache:
