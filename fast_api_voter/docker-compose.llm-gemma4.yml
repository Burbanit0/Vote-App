# docker-compose.llm-gemma4.yml -- S2.4 first-wave bake-off candidate (plan-polity-build-order.md), NOT a
# production serving config. Question (pre-registered): does coalition_decision's collapse persist on at
# least two non-Qwen families? This is the second.
#
# Result (run 2026-09-25): scripts/bakeoff_s24_first_wave_results.md -- passes determinism, but its logprob gate
# fails (the collapse cannot be read) and it runs away in thinking on the long families.
#
# Checkpoint: google/gemma-4-12B-it-qat-w4a16-ct (Google's own quantization-aware-trained W4A16,
# compressed-tensors), 9.56 GiB including a vision tower this project never uses. The head-room is the
# risk: at the shipped 0.80 the KV pool would be about zero, so --gpu-memory-utilization is 0.88 (the only
# capacity flag moved) and multimodal inputs are switched off. That fits a bake-off, which sends one request
# at a time; it is NOT sized for 12 concurrent requests. Its template reads `enable_thinking` (default off)
# and marks thinking with its own channel tokens, hence --reasoning-parser gemma4 (present in v0.30.0).
# Check the thinking gate: with thinking off the template may still emit an empty thought block.
#
# Every other flag is copied from docker-compose.llm.yml. Sequential arm, same port and container name:
#   docker compose -p polity-vllm down
#   docker compose -f docker-compose.llm-gemma4.yml up -d
#   python scripts/check_vllm_batching_determinism.py --save before.json   # then restart, --compare
#   python scripts/run_bakeoff.py --label gemma-4-12b --model gemma-4-12b
#   docker compose -f docker-compose.llm-gemma4.yml down
#   docker compose -f docker-compose.llm.yml up -d          # restore production

name: polity-vllm-gemma4

services:
  vllm:
    image: vllm/vllm-openai:v0.30.0
    container_name: vllm-polity
    ports:
      - "8000:8000"
    ipc: host
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    command:
      - "--model"
      - "google/gemma-4-12B-it-qat-w4a16-ct"
      - "--revision"
      - "1d2c2d7f2466070e69d6fb3fd5ce9a7d75f2f6ee"   # pinned via the HF API 2026-09-25
      - "--served-model-name"
      - "gemma-4-12b"
      - "--reasoning-parser"
      - "gemma4"
      - "--limit-mm-per-prompt"
      - '{"image": 0, "audio": 0}'
      - "--structured-outputs-config"
      - '{"backend": "xgrammar", "disable_any_whitespace": true}'
      - "--max-model-len"
      - "16384"
      - "--gpu-memory-utilization"
      - "0.88"                     # shipped: 0.80. The weights alone are 9.56 GiB.
      - "--port"
      - "8000"
      - "--seed"
      - "42"
      - "--enable-prompt-tokens-details"

volumes:
  huggingface_cache:
    external: true
    name: polity-vllm_huggingface_cache   # reuse the existing named volume
