version: '3.8'

services:
  # The backend — FastAPI served by uvicorn. It serves the whole API; the
  # frontend reaches it via /api/* (proxied by Vite in dev). The app is
  # stateless (no SQL DB, no auth) — Redis is the only backing service, used
  # purely as a compute cache for the voting engine.
  api:
    restart: always
    build: .
    container_name: fastapi_app
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "4434"]
    environment:
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGINS=http://localhost:3000
    ports:
      - "4434:4434"
    volumes:
      - .:/app
    depends_on:
      - redis
    networks:
      - mynetwork

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - mynetwork

networks:
  mynetwork:
