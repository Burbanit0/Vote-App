# docker-compose.llm-eagle3.yml -- EAGLE-3 speculative decoding probe, NOT a production serving config.
#
# WHY: n-gram speculation was dropped on 2026-09-20 because vLLM's Model Runner V2 does not support it
# (v0.30.0 config/vllm.py `_get_v2_model_runner_unsupported_features`: ngram, ngram_gpu, draft_model,
# suffix, medusa, mlp_speculator fall back to V1). EAGLE-type methods are NOT on that list, so EAGLE-3 is
# the one way to speculate without leaving V2. Question: is it faster than the shipped server, and what
# does it do to answers and to same-seed reproducibility (OBS-020)?
#
# The head is RedHatAI/Qwen3-8B-Thinking-speculator.eagle3 (speculators format, 2.15 GiB bf16, trained
# on thinking traces, default draft length 3). It is loaded next to the AWQ target, so it eats KV cache:
# --gpu-memory-utilization goes 0.80 -> 0.88 to keep at least one 16k sequence in the KV pool. That is
# the ONLY other change from docker-compose.llm.yml; every other flag is copied verbatim.
#
# Sequential arm, same port and container name as the shipped server (scripts look it up by name):
#   docker compose -f docker-compose.llm.yml down
#   docker compose -f docker-compose.llm-eagle3.yml up -d
#   ... measure ...
#   docker compose -f docker-compose.llm-eagle3.yml down
#   docker compose -f docker-compose.llm.yml up -d          # restore production
#
# House rule: verify >=3 consecutive clean restarts before trusting any serve config.

name: polity-vllm-eagle3

services:
  vllm:
    image: vllm/vllm-openai:v0.30.0
    container_name: vllm-polity
    ports:
      - "8000:8000"
    ipc: host
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    command:
      - "--model"
      - "Qwen/Qwen3-8B-AWQ"
      - "--revision"
      - "4da05a8edb55c6046cce958586c33b61da07bb79"
      - "--quantization"
      - "awq_marlin"
      - "--served-model-name"
      - "qwen3:8b"
      - "--reasoning-parser"
      - "qwen3"
      - "--structured-outputs-config"
      - '{"backend": "xgrammar", "disable_any_whitespace": true}'
      - "--max-model-len"
      - "16384"
      - "--gpu-memory-utilization"
      - "0.88"                     # shipped: 0.80. Room for the 2.15 GiB draft head.
      - "--port"
      - "8000"
      - "--seed"
      - "42"
      - "--enable-prompt-tokens-details"
      - "--speculative-config"
      - '{"method": "eagle3", "model": "RedHatAI/Qwen3-8B-Thinking-speculator.eagle3", "revision": "7073be9cfb319c1cbf84d3f4c7592ee9fcdc31a5", "num_speculative_tokens": 3}'

volumes:
  huggingface_cache:
    external: true
    name: polity-vllm_huggingface_cache   # reuse the existing named volume
