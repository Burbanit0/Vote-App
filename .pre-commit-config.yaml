# Vote Lab — Pre-commit hooks
# Install: pip install pre-commit && pre-commit install \
#          && pre-commit install --hook-type pre-push \
#          && pre-commit install --hook-type post-commit
# Run manually: pre-commit run --all-files

# ── Default stages ────────────────────────────────────────────────────────────
default_stages: [pre-commit]

repos:

  # ── General file hygiene ───────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: tsconfig.*\.json$   # tsconfig allows comments
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key       # no real private keys committed

  # ── Secret scanning ────────────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: (\.env\.example|package-lock\.json)

  # ── Python security (SAST) ─────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ['-r', 'fast_api_voter/api', '-ll', '--skip', 'B104,B311']
        # B104: binding 0.0.0.0 (expected in Docker), B311: random (not crypto use)
        pass_filenames: false

  # ── Python linting ─────────────────────────────────────────────────────────
  # Replaces flake8 (Lot 1, PLAN_SOLIDITE_TECHNIQUE.md). Rule selection lives
  # in fast_api_voter/pyproject.toml's [tool.ruff]/[tool.ruff.lint] — Ruff
  # auto-discovers it from the target path, no --config flag needed here.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        files: fast_api_voter/.*\.py$

  # ── Python type checking ───────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: mypy
        name: mypy (type checking)
        language: system
        entry: bash -c 'cd fast_api_voter && python -m mypy api/ --config-file mypy.ini'
        files: fast_api_voter/.*\.py$
        pass_filenames: false

  # ── Frontend linting ───────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (frontend)
        language: system
        entry: bash -c 'cd voter-app && npm run lint'
        files: voter-app/src/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

  # ── Dependency security audit ──────────────────────────────────────────────
  - repo: local
    hooks:
      - id: npm-audit
        name: npm audit (high+ CVEs)
        language: system
        entry: bash -c 'cd voter-app && npm audit --audit-level=high'
        files: voter-app/package(-lock)?\.json$
        pass_filenames: false

# ── Pre-push hooks (slower — run only before git push) ────────────────────────
  - repo: local
    hooks:
      - id: frontend-tests-coverage
        name: Frontend tests + coverage thresholds
        language: system
        entry: bash -c 'cd voter-app && npm test -- --coverage'
        pass_filenames: false
        stages: [pre-push]

      - id: backend-tests-coverage
        name: Backend tests + coverage
        language: system
        entry: bash -c 'cd fast_api_voter && python -m pytest api/tests -v --cov=api --cov-fail-under=90'
        pass_filenames: false
        stages: [pre-push]
        env:
          FLASK_ENV: testing

# ── Post-commit hooks (fire-and-forget, after the commit exists) ──────────────
  - repo: local
    hooks:
      - id: git-commit-capture
        name: Per-commit capture (Lot 0.5, polity worktree only)
        language: system
        entry: python3 scripts/git_commit_capture.py
        pass_filenames: false
        always_run: true
        stages: [post-commit]
        # Installed repo-wide (git hooks are shared across worktrees — see
        # the script's own docstring) but a strict no-op outside the
        # Vote-App-polity worktree. Never blocks: every failure path inside
        # the script prints a warning and exits 0.
        verbose: false
